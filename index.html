border-radius:18px;padding:20px 22px;box-shadow:0 7px 24px rgba(21,54,51,.04)}.search-panel h2{font-size:19px;margin:0 0 3px}.search-panel p{color:var(--muted);font-size:14px;margin:0}.search-wrap{position:relative;display:block}.search-wrap span{position:absolute;left:17px;top:13px;color:var(--muted)}#search{width:100%;border:1px solid #bfd1cd;background:var(--paper);border-radius:14px;padding:14px 16px 14px 46px;outline:none}#search:focus{background:#fff;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(21,122,114,.12)}\n    .reception-shortcut{margin:28px 0 18px;padding-top:22px;border-top:1px solid var(--line)}.shortcut-label{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}.shortcut-label strong{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}.shortcut-label span{color:var(--muted);font-size:14px}.reception-cta{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(110deg,#0d4f4b,#157a72);color:#fff;border-radius:18px;padding:21px 23px;text-decoration:none;box-shadow:var(--shadow)}.reception-cta strong{display:block;font-size:20px}.reception-cta span span{color:#d9efeb}.reception-cta b{font-size:22px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 28px}.quick button,.quick a{display:block;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;color:var(--ink);box-shadow:0 6px 20px rgba(21,54,51,.04);text-decoration:none}.quick button:hover,.quick a:hover{transform:translateY(-1px);border-color:#accbc6}.quick b{display:block;margin-bottom:2px}.quick small{color:var(--muted)}\n    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{font-size:21px;margin:0}.section-head p{margin:0;color:var(--muted);font-size:14px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:var(--muted)}.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:190px;display:flex;flex-direction:column;box-shadow:0 7px 24px rgba(21,54,51,.04)}.card:hover{border-color:#accbc6;box-shadow:var(--shadow)}.card-top{display:flex;justify-content:space-between;gap:10px}.icon{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#e6f2f0;color:var(--brand);font-weight:800}.badge{height:max-content;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;background:var(--blue-bg);color:var(--blue)}.badge.review{background:var(--amber-bg);color:var(--amber)}.card h3{font-size:17px;line-height:1.3;margin:13px 0 6px}.card p{color:var(--muted);font-size:14px;margin:0 0 15px}.meta{margin-top:auto;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid #edf2f1;padding-top:11px}.open{margin-top:12px;border:0;background:none;color:var(--brand2);font-weight:750;padding:0;text-align:left;text-decoration:none}.empty{display:none;background:#fff;border:1px dashed #b8cbc7;border-radius:16px;padding:32px;text-align:center;color:var(--muted)}\n    dialog{border:0;border-radius:18px;padding:0;max-width:620px;width:calc(100% - 32px);box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(9,32,30,.5)}.modal{padding:26px}.modal-head{display:flex;justify-content:space-between;gap:16px}.modal h2{margin:0 0 8px}.close{border:0;background:#eef4f2;width:36px;height:36px;border-radius:10px;font-size:20px}.steps{padding-left:20px}.steps li{margin:10px 0}.notice{background:#f0f7f6;border-left:4px solid var(--brand2);padding:12px 14px;border-radius:8px;margin-top:18px}.updated{color:var(--muted);font-size:13px;margin-top:20px}\n    @media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}}\n    @media(max-width:720px){.shell{display:block}.side{position:static;height:auto;padding:18px}.brand{margin:0}.nav,.side-note{display:none}main{padding:22px 16px 40px}.topbar{align-items:flex-start}.site-pill{display:none}.search-panel{grid-template-columns:1fr;gap:13px;padding:18px}.reception-shortcut{margin-top:24px}.shortcut-label{display:block}.shortcut-label span{display:block;margin-top:2px}.quick,.grid{grid-template-columns:1fr}.quick{gap:9px}.card{min-height:0}}\n  </style>\n<div class=\"shell\">\n  <aside class=\"side\">\n    <div class=\"brand\"><img class=\"brand-logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"><span>Staff hub</span></div>\n    <nav class=\"nav\" aria-label=\"Dashboard sections\">\n      <button class=\"active\" data-filter=\"All\">Home</button><a class=\"featured\" href=\"#/reception-guide\">Reception guide</a><button data-filter=\"Forms\">Forms & templates</button><button data-filter=\"Protocols\">Clinical protocols</button><button data-filter=\"Policies\">Practice policies</button><button data-filter=\"How-to\">Administrative protocols & common queries</button><button data-filter=\"People\">Contacts & escalation</button>\n    </nav>\n    <div class=\"side-note\">Internal working resource<br>Content should be checked against the current approved document.</div>\n  </aside>\n  <main>\n    <header class=\"topbar\"><div><h1>Good afternoon</h1><p class=\"subtitle\">Find the right document or answer without hunting through folders.</p></div><div class=\"site-pill\">Mold & Buckley</div></header>\n    <section class=\"search-panel\" aria-labelledby=\"searchTitle\"><div><h2 id=\"searchTitle\">Search the whole Staff Hub</h2><p>Find any form, protocol, policy or operational answer.</p></div><label class=\"search-wrap\"><span aria-hidden=\"true\">⌕</span><input id=\"search\" type=\"search\" placeholder=\"What are you looking for?\" aria-label=\"Search the whole staff hub\"></label></section>\n    <section class=\"reception-shortcut\" aria-labelledby=\"receptionShortcut\"><div class=\"shortcut-label\"><strong id=\"receptionShortcut\">Reception shortcut</strong><span>Use this when helping a patient with a query.</span></div><a class=\"reception-cta\" href=\"#/reception-guide\"><span><strong>Open the Reception Guide</strong><span>Start with “What does the patient need help with?” for quick, problem-based answers.</span></span><b aria-hidden=\"true\">→</b></a></section>\n    <section class=\"quick\" aria-label=\"Main destinations\">\n      <a href=\"#/reception-guide\"><b>Reception Guide</b><small>Problem-based operational answers</small></a>\n      <button data-filter=\"Protocols\"><b>Clinical protocols</b><small>Assessment and management guidance</small></button>\n      <button data-filter=\"How-to\"><b>Administrative protocols</b><small>Operational workflows and common queries</small></button>\n      <button data-filter=\"Forms\"><b>Forms & templates</b><small>Frequently used practice forms</small></button>\n      <button data-filter=\"Policies\"><b>Practice policies</b><small>Underlying governance documents</small></button>\n      <button data-filter=\"People\"><b>Contacts & escalation</b><small>Who to contact and when</small></button>\n    </section>\n    <div class=\"section-head\" id=\"resources\"><div><h2 id=\"sectionTitle\">Frequently used</h2><p id=\"resultCount\">8 resources</p></div><p>Owners and review dates shown on every item</p></div>\n    <div class=\"filters\" aria-label=\"Resource filters\"><button class=\"chip active\" data-filter=\"All\">All</button><button class=\"chip\" data-filter=\"Forms\">Forms</button><button class=\"chip\" data-filter=\"Protocols\">Protocols</button><button class=\"chip\" data-filter=\"Policies\">Policies</button><button class=\"chip\" data-filter=\"How-to\">How-to</button><button class=\"chip\" data-filter=\"People\">Contacts</button></div>\n    <section class=\"grid\" id=\"resourceGrid\"></section><div class=\"empty\" id=\"empty\"><h2>Can’t find what you need?</h2><p>Try another search or tell us what the Staff Hub should have answered.</p><a class=\"open\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Tell us what’s missing →</a></div>\n  </main>\n</div>\n<dialog id=\"detail\"><div class=\"modal\"><div class=\"modal-head\"><div><span class=\"badge\" id=\"modalBadge\"></span><h2 id=\"modalTitle\"></h2></div><button class=\"close\" aria-label=\"Close\">×</button></div><p id=\"modalDesc\"></p><ol class=\"steps\" id=\"modalSteps\"></ol><div class=\"notice\" id=\"modalNotice\"></div><div class=\"updated\" id=\"modalMeta\"></div></div></dialog>\n\n","script":"\nconst resources=[\n {cat:'Policies',title:'When the practice is informed of a patient’s death',desc:'The full workflow for verification, recording, certification and Medical Examiner notification.',owner:'Clinical governance',review:'Review date required',icon:'D',href:'#/patient-death-notification'},\n {cat:'Protocols',title:'Suspected urinary tract infection',desc:'Reception, HCA, nurse and clinician workflow for suspected UTI and urine samples.',owner:'Clinical team',review:'Review date required',icon:'U',href:'#/suspected-uti-protocol'},\n {cat:'Protocols',title:'Vitamin B12 deficiency treatment',desc:'Simplified investigation, initial treatment, retesting and maintenance pathway.',owner:'Clinical team',review:'Review date required',icon:'B12',href:'#/vitamin-b12-treatment'},\n {cat:'Forms',title:'Significant event / incident form',desc:'Record an incident, near miss or learning event for review.',owner:'Governance lead',review:'Apr 2027',icon:'!',steps:['Make the situation safe and inform the duty manager if urgent.','Complete the incident form before the end of the working day.','Add factual detail, immediate action and anyone already informed.'],note:'Urgent patient-safety concerns should be escalated immediately; do not wait for the form.'},\n {cat:'How-to',title:'Home visit request workflow',desc:'Reception and navigation workflow: emergencies, ability to attend, clinician callback and late-day routing.',owner:'Practice team',review:'Review date required',icon:'⌂',href:'#/home-visit-request',keywords:'patient cannot come attend surgery housebound too ill doctor home call out visit'},\n {cat:'How-to',title:'Patient access and appointment workflow',desc:'Zymego, eConsult Lite, appointment booking, troubleshooting, blood tests and sick notes.',owner:'Practice team',review:'Review date required',icon:'A',href:'#/patient-access-guide',keywords:'cannot use link zymego text message booking appointment online access'},\n {cat:'How-to',title:'Afternoon urgent appointment capacity',desc:'Navigation workflow for reviewing and converting excess unfilled urgent appointments at 12:30pm.',owner:'Clinical Admin Team',review:'Review date required',icon:'12:30',href:'#/urgent-appointment-capacity'},\n {cat:'How-to',title:'Secondary care and private provider requests',desc:'Who should prescribe, arrange investigations, chase results or retain responsibility for care.',owner:'Practice team',review:'Review date required',icon:'↔',href:'#/secondary-private-requests',keywords:'hospital consultant clinician private doctor clinic medication prescription blood test investigation chase results shared care'},\n {cat:'How-to',title:'Medlink chronic disease recall and review',desc:'Reception, nursing and admin workflow for chronic disease recall and review.',owner:'Nurse Manager / Pharmacist',review:'Review date required',icon:'M',href:'#/medlink-recall',keywords:'review due birth month medlink chronic disease nurse recall blood form'},\n {cat:'How-to',title:'Repeat medication review and reauthorisation',desc:'Six routes for repeat medicines requiring reauthorisation.',owner:'Medicines Management',review:'Review date required',icon:'Rx',href:'#/medication-reauthorisation',keywords:'medication needs reauthorising repeat meds review issue count pharmacist blood monitoring'},\n {cat:'Protocols',title:'Duty Doctor 5:00–6:30pm',desc:'Eligibility and workflow for urgent clinical problems after 5pm.',owner:'Clinical team',review:'Review date required',icon:'17',href:'#/duty-doctor',keywords:'child unwell after 5 late urgent cancer terminal acute illness evening'},\n {cat:'Protocols',title:'Skin problems navigation pathway',desc:'Photographs, Quick Win, rash, lesion or mole, Photo Clinic and Teledermatology.',owner:'Clinical team',review:'Review date required',icon:'S',href:'#/skin-navigation',keywords:'skin lesion rash mole photo clinic teledermatology benign removal'},\n {cat:'Protocols',title:'Type 2 diabetes nurse-led medication review',desc:'HbA1c targets, medication escalation, comorbidity checks and renal dosing.',owner:'Clinical team',review:'Review date required',icon:'T2',href:'#/type2-diabetes-review',keywords:'diabetes medication hba1c ozempic mounjaro dapagliflozin renal dose nurse review'},\n {cat:'Protocols',title:'Antidepressant initiation and review',desc:'Age-based early review, dose-change and routine authorisation pathways.',owner:'Clinical team',review:'Review date required',icon:'AD',href:'#/antidepressant-review',keywords:'antidepressant depression medication review started new dose increased under 25 over 25'},\n {cat:'How-to',title:'MGUS monitoring',desc:'April and October recall, required bloods and annual GP review.',owner:'Practice team',review:'Review date required',icon:'MG',href:'#/mgus-monitoring',keywords:'MGUS register April October bloods electrophoresis annual review'},\n {cat:'How-to',title:'Content requiring review',desc:'Management view of missing owners, review dates and outstanding governance.',owner:'Management team',review:'Live register',icon:'G',href:'#/content-review',keywords:'governance overdue due soon missing review date owner'},\n {cat:'How-to',title:'Staff Hub development backlog',desc:'Outstanding decisions and source material still required.',owner:'Management team',review:'Live register',icon:'…',href:'#/development-backlog',keywords:'backlog missing decision source required skin clinicians pharmacist list'},\n {cat:'How-to',title:'Reporting staff sickness',desc:'Who to contact, recording absence and return-to-work steps.',owner:'Practice manager',review:'Mar 2027',icon:'S',steps:['Contact the designated manager as early as possible before your shift.','Give an expected duration if known and agree the next update.','Complete self-certification and return-to-work documentation when requested.'],note:'This page is a quick guide; the staff absence policy remains the authoritative document.'},\n {cat:'People',title:'Safeguarding concern',desc:'Immediate escalation route and safeguarding leads for both sites.',owner:'Safeguarding leads',review:'Dec 2026',icon:'⚑',steps:['If anyone is in immediate danger, use the emergency pathway.','Record the concern in the clinical record using factual language.','Contact the safeguarding lead or duty clinician the same day.'],note:'Never delay escalation because information is incomplete.'},\n {cat:'Policies',title:'Annual leave policy',desc:'Booking principles, partner leave periods and fair allocation rules.',owner:'Management team',review:'Feb 2027',icon:'✓',steps:['Check available capacity for the requested dates.','Submit the request through the agreed leave process.','Do not make non-refundable arrangements until leave is approved.'],note:'Separate arrangements apply to partner and employed staff leave.'},\n {cat:'Protocols',title:'Test results workflow',desc:'How results are reviewed, actioned and communicated.',owner:'Clinical governance',review:'Nov 2026',icon:'R',steps:['Clinicians review and action their own results.','Record a clear action and timescale in the patient record.','Use the agreed escalation route for urgent or unallocated results.'],note:'Clinical responsibility is not transferred merely by sending an administrative task.'},\n {cat:'How-to',title:'Complaints and feedback',desc:'De-escalation, line-manager support and the formal complaints email route.',owner:'Practice team',review:'Review date required',icon:'C',href:'#/reception-common-queries/complaints'},\n {cat:'How-to',title:'Requesting clinical system access',desc:'Starter, role-change and access issue checklist.',owner:'IT lead',review:'May 2027',icon:'@',steps:['Confirm the staff member’s role, site and required systems.','Request the minimum access needed for the role.','Arrange identity checks and required training before activation.'],note:'Never share logins or smartcards while access is being arranged.'}\n];\nconst grid=document.querySelector('#resourceGrid'), search=document.querySelector('#search'), empty=document.querySelector('#empty'), count=document.querySelector('#resultCount'), title=document.querySelector('#sectionTitle'); let active='All';\nconst replacements={\"can't\":'cannot',cant:'cannot',unable:'cannot',meds:'medication',medicines:'medication',hospital:'secondary',doctor:'clinician',booking:'appointment'};const stopwords=new Set(['a','an','the','patient','patients','is','are','to','for','with','about','please','help','my','their','they','i','in','want','wants','need','needs','ask','asks','us']);function words(value){return value.toLowerCase().replace(/[’]/g,\"'\").replace(/[^a-z0-9'&]+/g,' ').trim().split(/\\s+/).filter(Boolean).map(w=>replacements[w]||w).filter(w=>!stopwords.has(w))}function matches(r,query){if(!query.trim())return true;const hay=words([r.title,r.desc,r.owner,r.cat,r.keywords||'',...(r.steps||[])].join(' '));const wanted=words(query);return wanted.length>0&&wanted.every(q=>hay.some(h=>h===q||h.startsWith(q)||q.startsWith(h)))}\nfunction render(){const q=search.value;let shown=resources.filter(r=>(active==='All'||r.cat===active)&&matches(r,q));if(active==='All'&&!q.trim())shown=shown.slice(0,8);grid.innerHTML=shown.map((r,i)=>`<article class=\"card\"><div class=\"card-top\"><div class=\"icon\">${r.icon}</div><span class=\"badge ${r.review.includes('2026')?'review':''}\">${r.cat}</span></div><h3>${r.title}</h3><p>${r.desc}</p><div class=\"meta\"><span>${r.owner}</span><span>${r.review.startsWith('Review')?r.review:'Review '+r.review}</span></div>${r.href?`<a class=\"open\" href=\"${r.href}\">Open guidance →</a>`:`<button class=\"open\" data-title=\"${r.title}\">Open guidance →</button>`}</article>`).join('');count.textContent=`${shown.length} resource${shown.length===1?'':'s'}`;empty.style.display=shown.length?'none':'block';grid.style.display=shown.length?'grid':'none';document.querySelectorAll('button.open').forEach(b=>b.onclick=()=>openDetail(resources.find(r=>r.title===b.dataset.title)));}\nfunction setFilter(v){active=v;title.textContent=v==='All'?'Frequently used':v==='How-to'?'Common queries':v==='People'?'Contacts & escalation':v;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===v));render()}\nfunction openDetail(r){document.querySelector('#modalBadge').textContent=r.cat;document.querySelector('#modalTitle').textContent=r.title;document.querySelector('#modalDesc').textContent=r.desc;document.querySelector('#modalSteps').innerHTML=r.steps.map(s=>`<li>${s}</li>`).join('');document.querySelector('#modalNotice').textContent=r.note;document.querySelector('#modalMeta').textContent=`Owner: ${r.owner} · Review: ${r.review}`;document.querySelector('#detail').showModal()}\ndocument.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{active='All';search.value=b.dataset.query;setFilter('All')});search.oninput=render;document.querySelector('.close').onclick=()=>document.querySelector('#detail').close();document.querySelector('#detail').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};render();\n"},"reception-guide":{"title":"Reception Guide | Bradley’s Practice Staff Hub","html":"<style>\n\n    :host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--amber:#fff4df;--shadow:0 12px 32px rgba(21,54,51,.08)}*{box-sizing:border-box}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.top-inner{max-width:1180px;margin:auto;padding:16px 26px;display:flex;justify-content:space-between;align-items:center;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:700}.logo{width:190px;filter:brightness(0) invert(1)}main{max-width:1180px;margin:auto;padding:42px 26px 70px}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:40px;letter-spacing:-.03em;line-height:1.1;margin:7px 0 11px}.lead{font-size:19px;color:#49635f;max-width:760px}.search{margin:25px 0 16px;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px 17px;box-shadow:var(--shadow);font:inherit}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font:inherit;color:var(--muted);cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:flex;flex-direction:column;min-height:178px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);box-shadow:0 6px 20px rgba(21,54,51,.04)}a.card:hover{transform:translateY(-1px);border-color:#9fc4be;box-shadow:var(--shadow)}.tag{align-self:flex-start;background:#e6f2f0;color:var(--brand);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.pending .tag{background:#f1f3f2;color:#687874}.card h2{font-size:18px;line-height:1.3;margin:14px 0 6px}.card p{margin:0;color:var(-- ed it, then follow the correct practice, hospital, private or Medlink route.',href:'#/patient-access-guide/blood-tests'},\n      {title:'Hospital / secondary care request',cat:'Admin',desc:'Medication, investigations, test results and responsibility for follow-up.',href:'#/secondary-private-requests/secondary-care',keywords:'hospital consultant asks gp blood tests additional investigations chase result communicate result follow up secondary care'},\n      {title:'Private healthcare request',cat:'Admin',desc:'Medication, investigations and private shared-care requests.',href:'#/secondary-private-requests/private-care',keywords:'private clinic consultant prescription prescribe tests bloods shared care private provider'},\n      {title:'Prescription query',cat:'Admin',desc:'NHS App first, with pharmacy, written and email alternatives.',href:'#/reception-common-queries/prescriptions',keywords:'repeat medication meds tablets drugs reorder medicine email pharmacy'},\n      {title:'Chronic disease review',cat:'Admin',desc:'Birth-month review and help for patients unable to complete the online form.',href:'#/patient-access-guide/chronic-review'},\n      {title:'Medlink chronic disease recall',cat:'Admin',desc:'Reception, nursing and admin workflow for chronic disease recalls and returned forms.',href:'#/medlink-recall',keywords:'review due birth month chronic condition recall blood form nurse form cannot complete medlink'},\n      {title:'Sick note request',cat:'Admin',desc:'New requests, extensions, self-certification and requests the practice does not provide.',href:'#/patient-access-guide/sick-notes'},\n      {title:'Results / measurements',cat:'Clinical routing',desc:'Route results or measurements to the requesting clinician, or use eConsult Lite.',href:'#/patient-access-guide/results'},\n      {title:'Referral update',cat:'Admin',desc:'Ask the patient to contact the hospital service they were referred to.',href:'#/reception-common-queries/referrals'},\n      {title:'AD
