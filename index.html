h3>Serum electrophoresis</h3></article></div></section><section id=\"review\"><span class=\"eyebrow\">April</span><h2>Book the annual GP review</h2><div class=\"action\"><strong>GP:</strong> use the “MGUS annual review” EMIS template and refer to secondary care where indicated by the existing protocol.</div></section><section class=\"feedback\"><article><h3>Can’t find what you need?</h3><p>Speak to your Team Manager. For an immediate clinical query, speak to the Navigating Clinician.</p></article><article><h3>Something missing or out of date?</h3><a class=\"button\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></section><footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Protocol for MGUS DES.</p><p><strong>Owner:</strong> to be confirmed · <strong>Last reviewed:</strong> not supplied · <strong>Next review:</strong> review date required.</p></footer></main></div>","script":""},"suspected-uti-protocol":{"title":"Suspected UTI protocol | Bradley’s Practice","html":"<style>\n\n    :host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--blue:#1e5f87;--blue-bg:#eaf5fb;--amber:#83500e;--amber-bg:#fff4df;--red:#9b2c2c;--red-bg:#fff0ef;--green-bg:#e8f5ef}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.58 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}a{color:var(--brand2)}.top{background:var(--brand);color:#fff}.top-inner{max-width:1160px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.back{color:#d7ebe8;text-decoration:none;font-weight:650}.practice{font-size:14px;color:#c2dbd7}.layout{max-width:1160px;margin:auto;display:grid;grid-template-columns:245px minmax(0,1fr);gap:34px;padding:36px 28px 70px}.contents{position:sticky;top:24px;align-self:start}.contents strong{display:block;margin-bottom:10px}.contents a{display:block;color:var(--muted);text-decoration:none;padding:7px 0 7px 12px;border-left:2px solid var(--line)}.contents a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.hero h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 14px}.lead{font-size:18px;color:#49635f;max-width:780px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.status{color:var(--amber);font-weight:700}.alert{border-left:4px solid var(--red);background:var(--red-bg);padding:15px 17px;border-radius:10px;margin:25px 0}.alert strong{display:block;color:var(--red);margin-bottom:3px}section{scroll-margin-top:25px;margin:40px 0}h2{font-size:25px;letter-spacing:-.02em;margin:0 0 16px}h3{font-size:18px;margin:24px 0 10px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.choice article{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.choice b{display:block;font-size:17px;margin-bottom:5px}.choice p{margin:0;color:var(--muted)}.steps{list-style:none;padding:0;margin:0;counter-reset:item}.steps li{counter-increment:item;position:relative;padding:0 0 23px 52px;min-height:42px}.steps li:before{content:counter(item);position:absolute;left:0;top:0;width:34px;height:34px;display:grid;place-items:center;background:#e3f1ee;color:var(--brand);border-radius:10px;font-weight:800}.steps li:not(:last-child):after{content:\"\";position:absolute;left:16px;top:38px;height:calc(100% - 37px);border-left:2px solid #d4e5e2}.steps b{display:block;margin-bottom:3px}.note{background:var(--blue-bg);color:#244e66;padding:14px 16px;border-radius:10px;margin:14px 0}.warning{background:var(--amber-bg);color:#69410d;padding:14px 16px;border-radius:10px;margin:14px 0}.symptoms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.symptoms div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:700}.groups{display:grid;gap:12px}.group{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.group-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:9px}.group h3{margin:0;font-size:18px}.duration{background:var(--green-bg);color:var(--brand);border-radius:999px;padding:4px 9px;font-size:13px;font-weight:800;white-space:nowrap}.group ul{margin:7px 0 0;padding-left:20px}.group li{margin:6px 0}.footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:14px}.print{border:1px solid #b9d2ce;background:#fff;color:var(--brand);border-radius:10px;padding:8px 12px;font-weight:700}.print:hover{background:#edf6f4}\n    @media(max-width:760px){.layout{display:block;padding:25px 17px 50px}.contents{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:28px}.contents a{display:inline-block;margin-right:12px}.hero h1{font-size:31px}.choice{grid-template-columns:1fr}.symptoms{grid-template-columns:1fr}.top-inner{padding:14px 17px}.practice{display:none}.group-head{display:block}.duration{display:inline-block;margin-top:7px}}@media print{.top,.contents,.print{display:none}.layout{display:block;max-width:none;padding:0}.hero h1{font-size:29px}:host{background:#fff}.alert,.note,.warning{border:1px solid #bbb}.group,.choice article{break-inside:avoid}}\n  </style>\n  <header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/home\">← Staff hub</a><span class=\"practice\">Bradley’s Practice · Clinical protocols</span><button class=\"print\" onclick=\"window.print()\">Print protocol</button></div></header>\n  <div class=\"layout\">\n    <nav class=\"contents\" aria-label=\"Protocol contents\"><strong>On this page</strong><a href=\"#/suspected-uti-protocol/reception\">Reception</a><a href=\"#/suspected-uti-protocol/testing\">HCA and nurse</a><a href=\"#/suspected-uti-protocol/assessment\">Clinical assessment</a><a href=\"#/suspected-uti-protocol/treatment\">Treatment pathway</a></nav>\n    <main>\n      <header class=\"hero\"><span class=\"eyebrow\">Clinical protocol</span><h1>Suspected urinary tract infection</h1><p class=\"lead\">Use this protocol when an adult contacts the practice with possible urinary tract infection symptoms or brings a urine sample to the surgery.</p><div class=\"meta\"><span class=\"pill\">Reception, HCA, nursing and clinical teams</span><span class=\"pill\">Owner: Clinical team</span><span class=\"pill status\">Review date to be confirmed</span></div></header>\n      <div class=\"alert\"><strong>Check for possible pyelonephritis</strong>Look for fever, vomiting or flank pain. Have a low threshold for face-to-face assessment where there are concerns. Consider prostatitis in men.</div>\n      <section id=\"reception\"><span class=\"eyebrow\">Role workflow</span><h2>Reception action when a sample is brought in</h2><p><strong>First establish whether a clinician requested the sample.</strong></p><div class=\"choice\"><article><b>Sample was requested</b><p>Place it on the HCA or nurse urine list. If the list is full, store it in the fridge overnight and add it to the following day’s list. On Fridays, if there is no capacity, ask the requesting clinician what action to take.</p></article><article><b>Sample was not requested</b><p>Ask the patient to complete an eConsult describing their symptoms. Explain that treatment can often be provided without testing and that they should use eConsult before bringing a sample next time. Store the sample in the fridge, but explain that it will not be tested until the eConsult has been submitted.</p></article></div></section>\n      <section id=\"testing\"><span class=\"eyebrow\">Role workflow</span><h2>HCA and nurse action</h2><ol class=\"steps\"><li><b>Check the clinical record before testing</b>Confirm what has been requested. Some patients require microscopy, culture and sensitivity (MC&amp;S) without dipstick testing, or MC&amp;S regardless of the dipstick result.</li><li><b>Do not test an unrequested sample</b>If no test has been requested, do not test the urine.</li><li><b>Notify the requesting GP of a dipstick result</b>Add a query to the requesting GP’s list to confirm that the result is available.</li><li><b>Use the navigating GP when necessary</b>If the requesting GP is not in, place the query on the navigating GP’s list.</li></ol></section>\n      <section id=\"assessment\"><span class=\"eyebrow\">Clinical assessment</span><h2>Assessing symptoms submitted by eConsult</h2><h3>Non-pregnant women under 65 without a catheter</h3><p>Diagnose UTI when two or three of the following symptoms are present. If only one is present, consider UTI and consider urine dipstick testing to strengthen the diagnosis.</p><div class=\"symptoms\"><div>Dysuria</div><div>Nocturia</div><div>Cloudy urine</div></div><h3>All other adults</h3><p>UTI is likely where there is new-onset dysuria, or at least two of the following:</p><div class=\"note\">Fever · urgency or frequency · incontinence · delirium · suprapubic pain · new haematuria</div><p>Consider a post-treatment urine dipstick for anyone with visible or non-visible haematuria.</p></section>\n      <section id=\"treatment\"><span class=\"eyebrow\">Clinician action</span><h2>Investigation and treatment pathway</h2><div class=\"groups\"><article class=\"group\"><div class=\"group-head\"><h3>Men</h3><span class=\"duration\">7 days</span></div><ul><li>Ask the patient to provide a urine sample and document that it is for MC&amp;S without dipstick testing.</li><li>Start empirical treatment.</li></ul></article><article class=\"group\"><div class=\"group-head\"><h3>Non-pregnant women under 65</h3><span class=\"duration\">3 days</span></div><ul><li>Start empirical treatment.</li><li>Consider urine dipstick testing if there is diagnostic uncertainty, for example only one symptom.</li><li>Request MC&amp;S following treatment failure or for recurrent UTI: two episodes in six months or three in 12 months.</li></ul></article><article class=\"group\"><div class=\"group-head\"><h3>Pregnant women with symptoms</h3><span class=\"duration\">7 days</span></div><ul><li>Ask the patient to provide a urine sample and document that it is for MC&amp;S without dipstick testing.</li><li>Start empirical treatment.</li></ul></article><article class=\"group\"><div class=\"group-head\"><h3>Non-pregnant women over 65</h3><span class=\"duration\">3 days</span></div><ul><li>Ask the patient to provide a urine sample and document that it is for MC&amp;S without dipstick testing.</li><li>Start empirical treatment.</li></ul></article><article class=\"group\"><div class=\"group-head\"><h3>Patients with a catheter</h3><span class=\"duration\">7 days</span></div><ul><li>Treat only when there are symptoms of UTI and systemic infection.</li><li>Request MC&amp;S without dipstick testing.</li><li>Start empirical treatment.</li><li>Arrange catheter change as soon as possible.</li></ul></article><article class=\"group\"><div class=\"group-head\"><h3>Pregnant women with asymptomatic bacteriuria</h3><span class=\"duration\">7 days</span></div><ul><li>Start targeted treatment.</li></ul></article></div><div class=\"warning\"><strong>Antibiotic choice:</strong> use the <a href=\"https://app.eolasmedical.com/organisation/Betsi%20Cadwaladr%20University%20Health%20Board/content-repository/22a686f4-ba4c-44fa-8492-c386aa25d368/f1afc233-ae53-4554-bb71-1c36672a5b6c\" target=\"_blank\" rel=\"noopener\">BCUHB local formulary on Eolas Medical ↗</a>. Check allergy status, renal function, pregnancy status, previous results and relevant interactions before prescribing.</div></section>\n      <footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Suspected UTI Proforma. This web version reorganises the supplied operational and clinical steps without changing the intended pathway.</p><p><strong>Governance action:</strong> confirm the clinical owner, approval date, review date and alignment with the current local antimicrobial guideline before formal adoption.</p></footer>\n    </main>\n  </div>\n","script":""},"vitamin-b12-treatment":{"title":"Vitamin B12 deficiency treatment | Bradley’s Practice","html":"<style>\n\n    :host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--green-ink:#285b33;--blue:#eaf5fb;--amber:#fff4df;--amber-ink:#70450d;--red:#fff0ef;--red-ink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.58 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.top-inner{max-width:1160px;margin:auto;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.back{color:#d7ebe8;text-decoration:none;font-weight:650}.practice{font-size:14px;color:#c2dbd7}.layout{max-width:1160px;margin:auto;display:grid;grid-template-columns:235px minmax(0,1fr);gap:36px;padding:36px 28px 70px}.contents{position:sticky;top:24px;align-self:start}.contents strong{display:block;margin-bottom:10px}.contents a{display:block;color:var(--muted);text-decoration:none;padding:7px 0 7px 12px;border-left:2px solid var(--line)}.contents a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.hero h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 14px}.lead{font-size:18px;color:#49635f;max-width:790px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.status{color:#83500e;font-weight:700}.alert{border-left:4px solid var(--red-ink);background:var(--red);padding:15px 17px;border-radius:10px;margin:25px 0}.alert strong{display:block;color:var(--red-ink);margin-bottom:3px}section{scroll-margin-top:24px;margin:40px 0}h2{font-size:25px;letter-spacing:-.02em;margin:0 0 16px}h3{font-size:18px;margin:0 0 8px}.route{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.route-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}.threshold{background:var(--green);color:var(--green-ink);border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}.route ol,.route ul{margin:8px 0 0;padding-left:22px}.route li{margin:8px 0}.treatment{background:var(--green);color:var(--green-ink);padding:13px 15px;border-radius:10px;margin:12px 0}.monitor{background:var(--amber);color:var(--amber-ink);padding:13px 15px;border-radius:10px;margin:12px 0}.causes{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.cause{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.cause h3{font-size:16px}.cause p{margin:0;color:var(--muted)}.note{background:var(--blue);color:#244e66;padding:14px 16px;border-radius:10px;margin:14px 0}.footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:14px}.print{border:1px solid #b9d2ce;background:#fff;color:var(--brand);border-radius:10px;padding:8px 12px;font-weight:700}.print:hover{background:#edf6f4}\n    @media(max-width:780px){.layout{display:block;padding:25px 17px 50px}.contents{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:28px}.contents a{display:inline-block;margin-right:12px}.hero h1{font-size:31px}.causes{grid-template-columns:1fr}.top-inner{padding:14px 17px}.practice{display:none}.route-head{display:block}.threshold{display:inline-block;margin-top:7px}}@media print{.top,.contents,.print{display:none}.layout{display:block;max-width:none;padding:0}.hero h1{font-size:29px}:host{background:#fff}.route,.cause{break-inside:avoid}.alert,.treatment,.monitor,.note{border:1px solid #bbb}}\n  </style>\n  <header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/home\">← Staff hub</a><span class=\"practice\">Bradley’s Practice · Clinical protocols</span><button class=\"print\" onclick=\"window.print()\">Print protocol</button></div></header>\n  <div class=\"layout\">\n    <nav class=\"contents\" aria-label=\"Protocol contents\"><strong>Choose a pathway</strong><a href=\"#/vitamin-b12-treatment/neuro\">Neurological symptoms</a><a href=\"#/vitamin-b12-treatment/anaemia\">Anaemia or macrocytosis</a><a href=\"#/vitamin-b12-treatment/no-anaemia\">No anaemia or macrocytosis</a><a href=\"#/vitamin-b12-treatment/notes\">Important notes</a></nav>\n    <main>\n      <header class=\"hero\"><span class=\"eyebrow\">Clinical protocol</span><h1>Vitamin B12 deficiency treatment</h1><p class=\"lead\">For adults with serum B12 below 180, select the pathway according to neurological symptoms and the presence of anaemia or macrocytosis.</p><div class=\"meta\"><span class=\"pill\">Clinical team</span><span class=\"pill\">Owner: Clinical team</span><span class=\"pill status\">Review date to be confirmed</span></div></header>\n      <div class=\"alert\"><strong>Neurological symptoms take priority</strong>Use the neurological pathway immediately where symptoms are present, including progressive unsteady gait, impaired balance or vibration sense, peripheral neuropathy, dementia, Leber’s optic atrophy or tobacco amblyopia.</div>\n\n      <section id=\"neuro\"><span class=\"eyebrow\">Pathway 1</span><h2>Neurological symptoms present</h2><article class=\"route\"><div class=\"route-head\"><h3>Treat without waiting for further classification</h3><span class=\"threshold\">B12 below 180</span></div><div class=\"treatment\"><strong>Initial treatment:</strong> prescribe intramuscular vitamin B12 1,000 micrograms three times weekly for two weeks.</div><div class=\"monitor\"><strong>Retesting:</strong> not required.</div><p><strong>Maintenance:</strong> prescribe intramuscular vitamin B12 every three months. If symptoms persist after two weeks, consider more frequent intramuscular treatment until there is no further improvement.</p></article></section>\n\n      <section id=\"anaemia\"><span class=\"eyebrow\">Pathway 2</span><h2>Anaemia or macrocytosis present</h2><p>Mild macrocytosis with mean cell volume below 110 fL occurs commonly. Test anti-intrinsic-factor antibodies.</p><article class=\"route\"><div class=\"route-head\"><h3>Anti-intrinsic-factor antibodies positive</h3><span class=\"threshold\">Likely pernicious anaemia</span></div><div class=\"treatment\"><strong>Initial treatment:</strong> prescribe intramuscular vitamin B12 1,000 micrograms three times weekly for two weeks.</div><div class=\"monitor\"><strong>Retesting:</strong> check FBC after three months; the pathway does not require repeat B12.</div><p><strong>Maintenance:</strong> over-the-counter oral vitamin B12 1,000 micrograms.</p></article><article class=\"route\"><div class=\"route-head\"><h3>Anti-intrinsic-factor antibodies negative</h3><span class=\"threshold\">Identify the cause</span></div><p>Assess whether another cause of B12 deficiency is likely, then follow the matching pathway below.</p></article><div class=\"causes\"><article class=\"cause\"><h3>Malabsorption</h3><p>IM 1,000 micrograms one to three times weekly for two weeks. Check FBC after three months; do not repeat B12. Maintain with OTC oral 1,000 micrograms.</p></article><article class=\"cause\"><h3>Dietary deficiency</h3><p>Give dietary advice and prescribe oral 1,000 micrograms daily for three months. Recheck FBC and B12, then maintain with OTC oral 100 micrograms.</p></article><article class=\"cause\"><h3>Medicine related</h3><p>Review the need for a PPI or H2 antagonist. For metformin, advise increased dietary calcium or an OTC calcium supplement. Follow the oral treatment routes shown below.</p></article></div><div class=\"note\"><strong>PPI or H2 antagonist:</strong> prescribe oral B12 1,000 micrograms daily for three months, then recheck FBC and B12. Maintain with OTC oral 100 micrograms.<br><br><strong>Metformin:</strong> prescribe oral B12 1,000 micrograms daily for four weeks, then recheck FBC and B12 after three months. Maintain with OTC oral 100 micrograms.</div><article class=\"route\"><div class=\"route-head\"><h3>No clear cause of B12 deficiency</h3><span class=\"threshold\">Investigate macrocytosis</span></div><p>Look for other causes of macrocytosis or anaemia unrelated to B12 deficiency, including liver dysfunction, folate deficiency, hypothyroidism, haemolysis, myelodysplasia and antimetabolite medicines.</p><div class=\"treatment\"><strong>Treatment:</strong> prescribe oral vitamin B12 1,000 micrograms daily for three months.</div><div class=\"monitor\"><strong>Retesting:</strong> check FBC and B12 after three months.</div><p><strong>Maintenance:</strong> OTC oral vitamin B12 100 micrograms.</p></article></section>\n\n      <section id=\"no-anaemia\"><span class=\"eyebrow\">Pathway 3</span><h2>No anaemia or macrocytosis</h2><article class=\"route\"><div class=\"route-head\"><h3>Serum B12 between 150 and 180</h3><span class=\"threshold\">Monitor</span></div><p>Reassure the patient that the result is unlikely to be clinically concerning. Recheck B12 after three months. If it remains low, monitor every six months for one year, then annually for two to five years.</p></article><article class=\"route\"><div class=\"route-head\"><h3>Serum B12 below 150</h3><span class=\"threshold\">Treat</span></div><div class=\"treatment\"><strong>Initial treatment:</strong> prescribe oral vitamin B12 1,000 micrograms daily for three months.</div><div class=\"monitor\"><strong>Retesting:</strong> check FBC and B12 after three months.</div><p><strong>Maintenance:</strong> OTC oral vitamin B12 100 micrograms.</p></article></section>\n\n      <section id=\"notes\"><span class=\"eyebrow\">Safety and follow-up</span><h2>Important notes</h2><div class=\"note\"><strong>Concurrent anaemia:</strong> consider adding oral folic acid 5 mg daily for four weeks when starting B12 in patients with anaemia due to vitamin B12 deficiency. This is intended to avoid inducing folate deficiency during increased normoblastic red-cell production.</div><div class=\"monitor\"><strong>If oral maintenance fails:</strong> consider prescribing intramuscular vitamin B12.</div></section>\n      <footer class=\"footer\"><p><strong>Source:</strong> supplied Bradley’s Practice B12 treatment algorithm. The flowchart has been reorganised into three sequential clinical pathways; its doses, durations and monitoring instructions have been retained.</p><p><strong>Governance action:</strong> confirm the clinical owner, approval date, review date, laboratory units and alignment with current local guidance before formal adoption.</p></footer>\n    </main>\n  </div>\n","script":""},"duty-doctor":{"title":"Duty Doctor 5:00–6:30pm | Bradley’s Practice","html":"<style>:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--amber:#fff4df;--blue:#eaf5fb;--red:#fff0ef;--redink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.topin{max-width:1160px;margin:auto;padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:750}.logo{width:174px;filter:brightness(0) invert(1)}.layout{max-width:1160px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:35px;padding:36px 26px 70px}.toc{position:sti s</a><a href=\"#/duty-doctor/visits\">Home visits</a></nav><main><header><span class=\"eyebrow\">Clinical protocol</span><h1>Duty Doctor 5:00–6:30pm</h1><p class=\"lead\">For urgent clinical problems arising after 5pm that cannot safely wait until the next working day.</p><div class=\"meta\"><span class=\"pill\">17:00–18:30</span><span class=\"pill\">Nominated doctor shown on EMIS Planner</span><span class=\"pill status\">Review date required</span></div></header><section id=\"purpose\"><div class=\"warning\"><strong>Not a routine overflow clinic.</strong> Earlier unmet demand should only be added in exceptional circumstances after communication between the Navigating Clinician and Duty Doctor.</div></section><section id=\"eligible\"><span class=\"eyebrow\">Who is eligible?</span><h2>Three practice criteria</h2><div class=\"grid three\"><article class=\"card\"><span class=\"tag\">Child</span><h3>New illness</h3></article><article class=\"card\"><span class=\"tag\">Cancer or terminal diagnosis</span><h3>A problem relating to the cancer or terminal condition</h3></article><article class=\"card\"><span class=\"tag\">New acute illness</span><h3>The patient feels they may require hospital assessment or admission if not seen that day</h3></article></div></section><section id=\"actions\"><span class=\"eyebrow\">Workflow</span><h2>What happens next?</h2><div class=\"steps\"><article class=\"step\"><h3>Add to the Duty Doctor telephone list</h3><p>Use the nominated Duty Doctor’s session on EMIS Planner.</p></article><article class=\"step\"><h3>Telephone assessment</h3><p>The Duty Doctor calls the patient and arranges face-to-face assessment if required.</p></article><article class=\"step\"><h3>Monitor eConsult</h3><p>The Duty Doctor monitors the eConsult inbox from 17:00–18:30 and addresses urgent cases that cannot wait until the next working day.</p></article></div><div class=\"note\">If time permits, the Duty Doctor may navigate from the eConsult inbox to reduce the following day’s workload.</div></section><section id=\"visits\"><span class=\"eyebrow\">Home visits</span><h2>Consider case by case</h2><p>A home visit may leave the practice without a doctor available for further urgent presentations. If the Duty Doctor leaves to visit, reception must be clearly instructed to direct any new urgent presentation to NHS 111.</p><a class=\"button\" href=\"#/home-visit-request\">Open Home Visit workflow</a></section><section class=\"feedback\"><article><h3>Need an answer now?</h3><p>Speak to your Team Manager first. For an immediate clinical query, speak to the Navigating Clinician or Duty Doctor after 5pm.</p></article><article><h3>Something missing or out of date?</h3><a class=\"button\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></section><footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Duty Doctor Standard Operating Protocol.</p><p><strong>Owner:</strong> Clinical team · <strong>Last reviewed:</strong> not supplied · <strong>Next review:</strong> review date required.</p></footer></main></div>","script":""},"skin-navigation":{"title":"Skin problems navigation pathway | Bradley’s Practice","html":"<style>:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--amber:#fff4df;--blue:#eaf5fb;--red:#fff0ef;--redink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.topin{max-width:1160px;margin:auto;padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:750}.logo{width:174px;filter:brightness(0) invert(1)}.layout{max-width:1 d medication review</h1><p class=\"lead\">Use the approved targets and medication sequence exactly as shown.</p><div class=\"meta\"><span class=\"pill\">Nursing team</span><span class=\"pill status\">Review date required</span></div></header><section id=\"step1\"><span class=\"eyebrow\">Step 1</span><h2>Assessment</h2><div class=\"tablewrap\"><table class=\"quicktable\"><thead><tr><th>Patient group</th><th>HbA1c target</th></tr></thead><tbody><tr><td>Age under 75, fit</td><td>&lt;54 mmol/mol</td></tr><tr><td>Age over 75, fit</td><td>54–59 mmol/mol</td></tr><tr><td>On triple therapy</td><td>Accept &lt;60 mmol/mol</td></tr><tr><td>Moderate frailty, CFS 5–6</td><td>59–64 mmol/mol</td></tr><tr><td>Severe frailty, CFS ≥7</td><td>65–70 mmol/mol</td></tr></tbody></table></div></section><section id=\"step2\"><span class=\"eyebrow\">Step 2</span><h2>Medication escalation</h2><div class=\"steps\"><article class=\"step\"><h3>First line</h3><p>Metformin MR + Dapagliflozin.</p></article><article class=\"step\"><h3>Second line</h3><p>Add Ozempic if obesity or weight loss is a priority. Alternative: Sitagliptin. Consider Gliclazide where hypoglycaemia risk is low.</p></article><article class=\"step\"><h3>Third line</h3><p>Metformin + Dapagliflozin + Ozempic; or Metformin + Dapagliflozin + Sitagliptin; or Metformin + Gliclazide + Dapagliflozin.</p></article></div></section><section id=\"step3\"><span class=\"eyebrow\">Step 3</span><h2>Comorbidity check</h2><div class=\"tablewrap\"><table class=\"quicktable\"><thead><tr><th>Condition</th><th>Action</th></tr></thead><tbody><tr><td>Heart failure</td><td>Prioritise Dapagliflozin.</td></tr><tr><td>CKD</td><td>Prioritise Dapagliflozin where renal function permits.</td></tr><tr><td>Established CVD</td><td>Dapagliflozin and/or Ozempic.</td></tr><tr><td>BMI ≥35</td><td>Consider Ozempic or Mounjaro.</td></tr><tr><td>Frail / high hypoglycaemia risk</td><td>Avoid Gliclazide where possible and avoid tight HbA1c targets.</td></tr></tbody></table></div></section><section id=\"renal\"><span class=\"eyebrow\">Renal safety</span><h2>Renal dose adjustments</h2><div class=\"tablewrap\"><table class=\"quicktable\"><thead><tr><th>Medicine</th><th>eGFR ≥45</th><th>eGFR 30–44</th><th>eGFR &lt;30 / dialysis</th></tr></thead><tbody><tr><td>Metformin</td><td>Full dose</td><td>Maximum 1 g/day</td><td>Stop / contraindicated</td></tr><tr><td>Sitagliptin</td><td>100 mg daily</td><td>50 mg daily</td><td>25 mg daily</td></tr><tr><td>Dapagliflozin</td><td colspan=\"3\">Do not initiate if eGFR &lt;15 mL/min/1.73m².</td></tr></tbody></table></div><div class=\"alert\"><strong>Before escalation:</strong> check renal function at least annually and before dose escalation.</div><div class=\"note\"><strong>When initiating Ozempic, Rybelsus or Mounjaro:</strong> add the patient to the SV list.</div></section><section class=\"feedback\"><article><h3>Immediate clinical query?</h3><p>Speak to the Navigating Clinician or Duty Doctor after 5pm where appropriate.</p></article><article><h3>Something missing or out of date?</h3><a class=\"button\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></section><footer class=\"footer\"><p><strong>Source:</strong> Diabetes Medication Management Flowchart Final version.</p><p><strong>Owner:</strong> Clinical team · <strong>Last reviewed:</strong> not supplied · <strong>Next review:</strong> review date required.</p></footer></main></div>","script":""},"antidepressant-review":{"title":"Antidepressant initiation and review | Bradley’s Practice","html":"<style>:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--amber:#fff4df;--blue:#eaf5fb;--red:#fff0ef;--redink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);f }.layout{display:block;max-width:none;padding:0}:host{background:#fff}.card,.step{break-inside:avoid}}\n\n</style><header class=\"top\"><div class=\"topin\"><a class=\"back\" href=\"#/home\">← Staff hub</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"></div></header><div class=\"layout\"><nav class=\"toc\"><strong>Choose a route</strong><a href=\"#/antidepressant-review/over25\">Age over 25</a><a href=\"#/antidepressant-review/under25\">Age 25 or under</a><a href=\"#/antidepressant-review/review\">At review</a><a href=\"#/antidepressant-review/routine\">Routine review</a><a href=\"#/antidepressant-review/messages\">Message templates</a></nav><main><header><span class=\"eyebrow\">Clinical protocol</span><h1>Antidepressant initiation and review</h1><p class=\"lead\">Age-based initiation, early review and ongoing medication-review pathway.</p><div class=\"meta\"><span class=\"pill\">Clinical team · Medicines Management</span><span class=\"pill status\">Review date required</span></div></header><div class=\"alert\"><strong>Clinical concern takes priority.</strong> Make alternative arrangements for patients considered high risk, particularly where overdose is a concern. Red flags require immediate remedial action.</div><section><div class=\"grid\"><article class=\"card\" id=\"over25\"><span class=\"tag\">Age over 25</span><h2>First review at 2 weeks</h2><ol><li>Add medicine as repeat with one issue.</li><li>Send “Starting anti-depressant” message specifying two weeks.</li><li>Review form returns to eConsult inbox.</li><li>If satisfactory, send “Interim anti-depressant review”.</li><li>Second review at four weeks.</li></ol></article><article class=\"card\" id=\"under25\"><span class=\"tag warn\">Age 25 or under</span><h2>First review at 1 week</h2><ol><li>Add medicine as repeat with one issue.</li><li>Send “Starting anti-depressant” message specifying one week.</li><li>Review form returns to eConsult inbox.</li><li>If satisfactory, send “Interim anti-depressant review”.</li><li>Second review at four weeks.</li></ol></article></div></section><section id=\"review\"><span class=\"eyebrow\">When a review form returns</span><h2>Review and route</h2><div class=\"grid three\"><article class=\"card\"><span class=\"tag\">Satisfactory</span><p>Add as a query for the initiating clinician. Continue and reauthorise where appropriate.</p></article><article class=\"card\"><span class=\"tag warn\">Further input</span><p>Clinician decides whether to message, telephone or arrange face-to-face review.</p></article><article class=\"card\"><span class=\"tag red\">Red flag or concern</span><p>Take immediate remedial action and arrange review according to clinical concern.</p></article></div><div class=\"note\">If the initiating clinician will be absent for more than one week, the Navigating Clinician decides whether it is safe to wait or should be actioned by the Navigator.</div><div class=\"warning\"><strong>Dose increased:</strong> issue the new dose and restart the appropriate age-based initiation review pathway.</div></section><section id=\"routine\"><span class=\"eyebrow\">When authorisation expires</span><h2>Routine medication review</h2><ol><li>Medicines Management sends the “Antidepressant review” iPlato message.</li><li>The form returns via the eConsult inbox.</li><li>If satisfactory, the clinician sends “Depression med review” and reauthorises appropriately.</li><li>If not satisfactory, request more information, telephone the patient, or arrange follow-up at an urgency determined by clinical concern.</li></ol></section><section id=\"messages\"><span class=\"eyebrow\">Reference</span><h2>Message templates</h2><details><summary>Starting anti-depressant</summary><p>Please complete the depression or anxiety review form at the specified interval after starting medication. The approved template includes the practice WebGP review link and advice to contact the practice immediately or NHS 111 if thoughts of self-harm or suicide occur.</p></details><details><summary>Interim anti-depressant review</summary><p>Thank the patient for completing the form, confirm continuation where appropriate, and ask them to repeat the form after four weeks. Use the approved iPlato/eConsult template.</p></details><details><summary>Antidepressant review</summary><p>Advise that the medication review is due and ask the patient to complete the approved online form, including whether the medication is working.</p></details><div class=\"note\">Use the approved templates in the clinical system. This page summarises their purpose rather than replacing the live template text.</div></section><section class=\"feedback\"><article><h3>Can’t find what you need?</h3><p>For an immediate clinical query, speak to the Navigating Clinician or Duty Doctor after 5pm.</p></article><article><h3>Something missing or out of date?</h3><a class=\"button\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></section><footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Protocol for reviewing anti-depressant medications.</p><p><strong>Owner:</strong> Clinical team · <strong>Last reviewed:</strong> not supplied · <strong>Next review:</strong> review date required.</p></footer></main></div>","script":""},"content-review":{"title":"Content requiring review | Bradley’s Practice","html":"<style>:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--amber:#fff4df;--blue:#eaf5fb;--red:#fff0ef;--redink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.topin{max-width:1160px;margin:auto;padding:15px 26px;display:flex;ali     const DEFAULT_PAGE='home';
    let currentPage='';

    function parseRoute(){
      const raw=decodeURIComponent(location.hash.replace(/^#\/?/,''));
      if(!raw)return{page:DEFAULT_PAGE,anchor:''};
      const [page,...anchorParts]=raw.split('/');
      return{page:PAGES[page]?page:DEFAULT_PAGE,anchor:anchorParts.join('/')};
    }

    function go(page,anchor=''){
      const target=page==='index'||page==='index.html'?'home':page.replace(/\.html$/,'');
      const next='#/'+(PAGES[target]?target:DEFAULT_PAGE)+(anchor?'/'+encodeURIComponent(anchor):'');
      if(location.hash===next)render();else location.hash=next;
    }

    function handleNavigation(event,root,page){
      const link=event.composedPath().find(node=>node?.tagName==='A');
      if(!link)return;
      const href=link.getAttribute('href')||'';
      if(!href||href.startsWith('http:')||href.startsWith('https:')||href.startsWith('mailto:')||href.startsWith('tel:'))return;
      event.preventDefault();
      if(href.startsWith('#/')){
        const [target,...parts]=href.slice(2).split('/');
        go(target,parts.join('/'));
        return;
      }
      if(href.startsWith('#')){
        go(page,href.slice(1));
        return;
      }
      const [file,anchor='']=href.split('#');
      go(file.replace(/\.html$/,''),anchor);
    }

    function render(){
      const route=parseRoute();
      const page=PAGES[route.page];
      const app=document.getElementById('app');
      const mount=document.createElement('div');
      app.replaceChildren(mount);
      const root=mount.attachShadow({mode:'open'});
      root.innerHTML=page.html.replaceAll('__BRADLEYS_LOGO__',BRADLEYS_LOGO);
      root.addEventListener('click',event=>handleNavigation(event,root,route.page));
      document.title=page.title;
      currentPage=route.page;
      if(page.script){
        try{new Function('document',page.script)(root)}
        catch(error){console.error('View initialisation failed:',route.page,error)}
      }
      requestAnimationFrame(()=>{
        if(route.anchor){
          const target=root.getElementById(route.anchor);
          if(target)target.scrollIntoView({block:'start'});
        }else window.scrollTo({top:0});
      });
    }

    addEventListener('hashchange',render);const password=prompt("Enter Bradley's Practice Staff Password");if(password==="bradstaff"){render();}else{document.body.innerHTML="<h1>Access Denied</h1>";}
  </script>
</body>
</html>
