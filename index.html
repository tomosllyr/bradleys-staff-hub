<title>Bradley’s Practice Staff Hub</title>
<style>
:root{
  --navy:#123b5d;--navy2:#0b2c46;--blue:#1d6f96;--teal:#16857a;--bg:#f4f7f9;
  --card:#fff;--text:#17212b;--muted:#647482;--line:#dbe4ea;--soft:#edf4f7;
  --warn:#fff6dc;--warn-border:#c88913;--danger:#fff0f0;--danger-border:#c43c3c;
  --success:#eaf7f1;--shadow:0 6px 24px rgba(18,59,93,.08);--radius:15px
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input{font:inherit}.hidden{display:none!important}
header{background:linear-gradient(120deg,var(--navy2),var(--navy));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.top{max-width:1280px;margin:auto;padding:14px 22px;display:flex;gap:18px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;min-width:270px;cursor:pointer}
.logo{width:45px;height:45px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:21px}
.brand strong{font-size:18px}.brand small{display:block;color:#dce9f2}
nav{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:transparent;color:#e9f2f7;padding:8px 10px;border-radius:9px;cursor:pointer}
nav button:hover,nav button.active{background:#ffffff18;color:#fff}
main{max-width:1180px;margin:auto;padding:28px 22px 70px}
.notice{background:#eaf2f6;border:1px solid #cbdde7;border-radius:10px;padding:9px 13px;color:#365568;font-size:13px;margin-bottom:22px}
.hero{padding:22px 0 12px}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:800;color:var(--blue)}
h1{font-size:34px;line-height:1.15;margin:6px 0 8px;color:var(--navy2)}h2{font-size:24px;color:var(--navy2);margin:28px 0 12px}
h3{font-size:17px;color:var(--navy);margin:0 0 6px}p{margin:7px 0 12px}.lead{font-size:18px;color:#506573;max-width:760px}
.search-wrap{background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);margin:18px 0 24px}
.search-row{display:flex;gap:10px}.search-row input{flex:1;border:2px solid #b8ccd8;border-radius:11px;padding:13px 15px;outline:none}
.search-row input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1d6f9618}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--navy2)}.btn.secondary{background:#e6eff4;color:var(--navy)}.btn.teal{background:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.grid.two{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px #123b5d0b}
.click{cursor:pointer;transition:.15s}.click:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#a9c4d2}
.icon{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--navy);font-weight:800;margin-bottom:12px}
.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:11px}.tag{background:#eef3f6;border-radius:20px;padding:3px 8px}
.shortcut{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#e8f4f4;border-left:5px solid var(--teal);padding:20px;border-radius:12px;margin:20px 0}
.resource{display:flex;gap:14px;align-items:flex-start}.resource .icon{flex:0 0 38px}.resource p{color:#526774}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;cursor:pointer;margin-bottom:12px}
.protocol-head{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border-top:5px solid var(--blue)}
.gov{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.gov div{background:#f4f7f9;border-radius:8px;padding:8px;font-size:12px}.gov b{display:block;color:#506573}
.callout{padding:16px 17px;border-radius:11px;margin:16px 0;background:#edf5f8;border-left:4px solid var(--blue)}
.callout.warn{background:var(--warn);border-color:var(--warn-border)}.callout.danger{background:var(--danger);border-color:var(--danger-border)}
.steps{display:grid;gap:10px;margin:15px 0}.step{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px}.step b{color:var(--navy)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice>div{border:1px solid var(--line);border-radius:11px;padding:15px;background:#fff}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{border:1px solid #bdd0da;background:#fff;color:var(--navy);border-radius:20px;padding:7px 12px;cursor:pointer}.tabs button.active{background:var(--navy);color:#fff}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}summary{cursor:pointer;font-weight:700;color:var(--navy)}
.feedback{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}.feedback .cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.search-results{margin-top:12px;display:grid;gap:8px}.result{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.result:hover{border-color:var(--blue)}
.empty{padding:18px;background:var(--warn);border-radius:10px}
ul{padding-left:20px}li{margin:5px 0}.muted{color:var(--muted)}
footer{text-align:center;color:#73838e;padding:25px;font-size:12px}
@media(max-width:850px){header{position:relative}.top{align-items:flex-start;flex-direction:column}.brand{min-width:0}nav{margin:0}.grid,.grid.two,.choice,.feedback .cols,.gov{grid-template-columns:1fr}.shortcut{align-items:flex-start;flex-direction:column}h1{font-size:29px}}
</style>

homevisit:`<div class="callout danger"><b>Emergency?</b> Ask: “Do you feel this is an emergency requiring an ambulance?” If yes, follow the existing emergency process / call 999. Suicidal presentation: follow the approved urgent escalation including urgent clinician callback.</div>

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function normalize(s){return s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
const synonyms={

function search(q){
 let nq=normalize(q); if(!nq)return[];
 for(const [k,v] of Object.entries(synonyms)) if(nq.includes(k)) nq+=" "+v;
 const terms=nq.split(" ").filter(x=>x.length>1);
 return resources.map(r=>{const hay=normalize(r.title+" "+r.desc+" "+r.keywords+" "+r.type);let score=0;terms.forEach(t=>{if(hay.includes(t))score+=2;if(normalize(r.title).includes(t))score+=2});if(hay.includes(nq))score+=8;return [r,score]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,10);
}
function resourceCard(r){return `<div class="card click resource" onclick="openResource('${r.id}')"><div class="icon">${r.icon}</div><div><h3>${r.title}</h3><p>${r.desc}</p><div class="meta"><span class="tag">${r.type}</span><span>${r.owner}</span><span>${r.review}</span></div></div></div>`}
function setNav(id){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id))}
function feedback(){return `<div class="feedback"><h3>Can’t find what you need?</h3><div class="cols"><div><b>Need an answer now?</b><p>If the guidance above doesn’t answer your question, speak to your Team Manager. For an immediate clinical query, speak to the Navigating Clinician or Duty Doctor after 5pm where appropriate.</p></div><div><b>The Staff Hub should have answered this</b><p>Tell us what was missing, unclear or out of date.</p><a class="btn teal" href="${FORM_URL}" target="_blank" rel="noopener">Tell us what’s missing</a></div></div></div>`}
function showPage(id){
 setNav(id); window.scrollTo(0,0);
 if(id==="home")return renderHome();
 if(id==="reception")return renderReception();
 if(id==="contacts")return renderList("Contacts & escalation","Who to contact and when.",resources.filter(r=>r.cat==="contacts"||["duty","complaints"].includes(r.id)));
 const map={forms:["Forms & templates","Frequently used practice forms and templates."],clinical:["Clinical protocols","Assessment and management guidance."],policies:["Practice policies","Underlying governance documents."],admin:["Administrative protocols & common queries","Operational workflows and practical how-to guidance."]};
 const [title,sub]=map[id]; renderList(title,sub,resources.filter(r=>r.cat===id));
}
function renderHome(){
 document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Good ${new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening"}</div><h1>Find the right document or answer without hunting through folders.</h1><p class="lead">Bradley’s Practice · Mold &amp; Buckley</p></section>
 <div class="search-wrap"><h3>Search the whole Staff Hub</h3><p class="muted">Find any form, protocol, policy or operational answer.</p><div class="search-row"><input id="searchBox" placeholder="e.g. patient can't use link, hospital wants bloods, home visit…" onkeydown="if(event.key==='Enter')runSearch()"><button class="btn" onclick="runSearch()">Search</button></div><div id="searchResults" class="search-results"></div></div>
 <div class="shortcut"><div><div class="eyebrow">Reception shortcut</div><h2 style="margin:3px 0">What does the patient need help with?</h2><p>Use this when helping a patient with a query. Start here for quick, problem-based answers.</p></div><button class="btn teal" onclick="showPage('reception')">Open the Reception Guide</button></div>
 <h2>Staff Hub</h2><div class="grid">${[
 ["reception","R","Reception Guide","Problem-based operational answers"],
 ["clinical","C","Clinical protocols","Assessment and management guidance"],
 ["admin","A","Administrative protocols","Operational workflows and common queries"],
 ["forms","F","Forms & templates","Frequently used practice forms"],
 ["policies","P","Practice policies","Underlying governance documents"],
 ["contacts","☎","Contacts & escalation","Who to contact and when"]
 ].map(x=>`<div class="card click" onclick="showPage('${x[0]}')"><div class="icon">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join("")}</div>
 <div class="section-head"><div><h2>Frequently used</h2><p class="muted">Owners and review dates shown on every item</p></div></div><div class="grid two">${resources.slice(0,8).map(resourceCard).join("")}</div>`;
}
function runSearch(){
 const q=document.getElementById("searchBox").value, rs=search(q), el=document.getElementById("searchResults");
 el.innerHTML=rs.length?rs.map(r=>`<div class="result" onclick="openResource('${r.id}')"><b>${r.title}</b><div class="muted">${r.desc}</div></div>`).join(""):`<div class="empty"><b>Can’t find what you need?</b><p>Try another search or tell us what guidance is missing.</p><a class="btn teal" target="_blank" rel="noopener" href="${FORM_URL}">Tell us what’s missing</a></div>`;
}
function renderReception(){
 document.getElementById("app").innerHTML=`<button class="back" onclick="showPage('home')">← Home</button><div class="hero"><div class="eyebrow">Reception Guide</div><h1>What does the patient need help with?</h1><p class="lead">Choose the problem you are dealing with. You do not need to know which policy contains the answer.</p></div>
 <div class="grid">${receptionTopics.map(([t,id])=>`<div class="card click" onclick="openResource('${id}')"><h3>${t}</h3><p>${resources.find(r=>r.id===id)?.desc||""}</p></div>`).join("")}</div>
 <div class="feedback"><h3>Can’t find the answer?</h3><p>Have you searched the Staff Hub but couldn’t find the answer you needed? Tell us what you were looking for. This helps identify new guidance that needs to be added.</p><a class="btn teal" href="${FORM_URL}" target="_blank" rel="noopener">Tell us what’s missing</a></div>`;
}
function renderList(title,sub,list){
 document.getElementById("app").innerHTML=`<button class="back" onclick="showPage('home')">← Home</button><div class="hero"><h1>${title}</h1><p class="lead">${sub}</p></div><div class="grid two">${list.length?list.map(resourceCard).join(""):`<div class="card"><p>No resources are currently surfaced in this section.</p></div>`}</div>${feedback()}`;
}
function openResource(id){
 const r=resources.find(x=>x.id===id); if(!r)return;
 setNav(r.cat);
 document.getElementById("app").innerHTML=`<button class="back" onclick="showPage('${r.cat==='contacts'?'contacts':r.cat}')">← Back</button>
 <div class="protocol-head"><div class="eyebrow">${r.type}</div><h1>${r.title}</h1><p class="lead">${r.desc}</p><div class="gov"><div><b>Owner</b>${r.owner}</div><div><b>Last reviewed</b>Review date required</div><div><b>Next review</b>${r.review}</div><div><b>Source</b>Current approved practice document</div></div></div>
 <section>${detail[id]||`<div class="callout warn"><b>Approved source required.</b> This resource is indexed in the Staff Hub, but its full operational content is not reproduced in this standalone export because the available source does not safely support additional detail.</div>`}</section>
 ${related(id)}${feedback()}<div class="feedback"><h3>Something missing or out of date?</h3><p>Found something missing, unclear or out of date? Let us know so we can improve the Staff Hub.</p><a class="btn teal" href="${FORM_URL}" target="_blank" rel="noopener">Suggest an update</a></div>`;
 window.scrollTo(0,0);
}
function related(id){
 const rel={homevisit:["duty"],duty:["homevisit"],medlink:["meds"],meds:["medlink"],secondary:["meds"],access:["homevisit","duty"],skin:[]}[id]||[];
 return rel.length?`<h2>Related guidance</h2><div class="grid two">${rel.map(x=>resourceCard(resources.find(r=>r.id===x))).join("")}</div>`:"";
}
document.getElementById("nav").innerHTML=navItems.map(([id,t])=>`<button data-id="${id}" onclick="showPage('${id}')">${t}</button>`).join("");
const password = prompt("Enter Bradley's Practice Staff Password"); if (password === "bradstaff") { showPage("home"); } else { document.body.innerHTML = "<h1>Access Denied</h1>"; }
</script>
</body>
</html>
