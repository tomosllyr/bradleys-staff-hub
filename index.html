nst wanted=words(query);return wanted.length>0&&wanted.every(q=>hay.some(h=>h===q||h.startsWith(q)||q.startsWith(h)))}\n    function render(){const q=search.value;const rows=topics.filter(t=>(filter==='All'||t.cat===filter)&&matches(t,q));grid.innerHTML=rows.map(t=>t.pending?`<article class=\"card pending\"><span class=\"tag\">Guidance pending</span><h2>${t.title}</h2><p>${t.desc}</p></article>`:`<a class=\"card\" href=\"${t.href}\"><span class=\"tag\">${t.cat}</span><h2>${t.title}</h2><p>${t.desc}</p><span class=\"go\">Open guide →</span></a>`).join('');empty.style.display=rows.length?'none':'block';grid.style.display=rows.length?'grid':'none'}\n    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});search.oninput=render;render();\n  "},"home-visit-request":{"title":"Home visit request workflow | Bradley’s Practice","html":"<style>\n\n    :host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--red:#fff0ef;--red-ink:#8e2929;--amber:#fff4df;--amber-ink:#70450d;--blue:#eaf5fb;--green:#e7f5e0}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.top-inner{max-width:1160px;margin:auto;padding:15px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:700}.logo{width:168px;filter:brightness(0) invert(1)}.layout{max-width:1160px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;padding:36px 28px 70px}.contents{position:sticky;top:24px;align-self:start}.contents strong{display:block;margin-bottom:10px}.contents a{display:block;color:var(--muted);text-decoration:none;padding:7px 0 7px 12px;border-left:2px solid var(--line)}.contents a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 13px}h2{font-size:25px;margin:0 0 16px}h3{font-size:18px;margin:0 0 7px}.lead{font-size:18px;color:#49635f;max-width:790px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.status{color:#83500e;font-weight:700}.alert,.notice,.script{padding:15px 17px;border-radius:10px;margin:16px 0}.alert{border-left:4px solid var(--red-ink);background:var(--red)}.alert strong{color:var(--red-ink)}.notice{background:var(--amber);color:var(--amber-ink)}.script{background:var(--blue);color:#244e66}.script q{font-weight:700}.steps{counter-reset:step;display:grid;gap:13px}.step{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px 20px 19px 66px}.step:before{counter-increment:step;content:counter(step);position:absolute;left:18px;top:18px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--brand);color:#fff;font-weight:800}.step p{margin:5px 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:15px 0}.choice article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.choice .yes{border-top:4px solid var(--brand2)}.choice .no{border-top:4px solid #d79025}section{scroll-margin-top:24px;margin:40px 0}.route{background:var(--green);border-radius:14px;padding:18px;margin:14px 0}.route strong{display:block}.related{display:flex;flex-wrap:wrap;gap:10px}.button{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:750}.button.secondary{background:#fff;color:var(--brand);border:1px solid #b9d2ce}.support{display:grid;grid-template-columns:1fr 1fr;gap:13px}.support article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.support h3{font-size:17px}.support p{color:var(--muted);margin:6px 0}.disabled{opacity:.7;cursor:not-allowed}.footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:14px}.print{border:1px solid #b9d2ce;background:#fff;color:var(--brand);border-radius:10px;padding:8px 12px;font-weight:700}\n    @media(max-width:780px){.layout{display:block;padding:25px 17px 50px}.contents{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:28px}.contents a{display:inline-block;margin-right:10px}.logo{display:none}h1{font-size:31px}.choice,.support{grid-template-columns:1fr}.top-inner{padding:14px 17px}}@media print{.top,.contents,.print,.support{display:none}.layout{display:block;max-width:none;padding:0}:host{background:#fff}.step,.choice article{break-inside:avoid}}\n  </style>\n  <header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/reception-guide\">← Reception Guide</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"><button class=\"print\" onclick=\"window.print()\">Print workflow</button></div></header>\n  <div class=\"layout\">\n    <nav class=\"contents\" aria-label=\"Page contents\"><strong>On this page</strong><a href=\"#/home-visit-request/immediate\">Immediate safety</a><a href=\"#/home-visit-request/attend\">Can they attend?</a><a href=\"#/home-visit-request/route\">Route the request</a><a href=\"#/home-visit-request/late\">After 5pm</a><a href=\"#/home-visit-request/help\">Help and updates</a></nav>\n    <main>\n      <header><span class=\"eyebrow\">Reception quick guide · Administrative workflow</span><h1>Home visit request</h1><p class=\"lead\">Use this workflow when a patient, carer, relative or third party asks for a home visit. Reception gathers the information and routes the request; a clinician decides whether a visit is appropriate.</p><div class=\"meta\"><span class=\"pill\">Reception / Navigation</span><span class=\"pill\">Owner: to be confirmed</span><span class=\"pill status\">Review date required</span></div></header>\n\n      <section id=\"immediate\"><span class=\"eyebrow\">Start here</span><h2>Immediate safety</h2><div class=\"steps\"><article class=\"step\"><h3>Record a working contact number</h3><p>Take the caller’s telephone number at the start, whether the caller is the patient, a carer, a relative or another person.</p></article><article class=\"step\"><h3>Ask whether this is an emergency requiring 999</h3><div class=\"choice\"><article class=\"yes\"><h3>Yes</h3><p>Advise the caller to call <strong>999 immediately</strong>.</p></article><article class=\"no\"><h3>No</h3><p>Continue the assessment. Tell the caller to call 999 if the condition worsens or their concern increases.</p></article></div></article></div><div class=\"alert\"><strong>Suicidal patient</strong><br>Tell the caller to call 999 and arrange a priority clinician callback.</div></section>\n\n      <section id=\"attend\"><span class=\"eyebrow\">Decision point</span><h2>Can the patient attend the surgery?</h2><p>Establish whether the patient is reasonably able to attend given their <strong>current condition and circumstances</strong>.</p><div class=\"choice\"><article class=\"yes\"><h3>Unable to attend</h3><p>Continue with the home-visit request. The patient does not need to be permanently housebound: acute illness or deterioration may make someone temporarily unable to attend.</p></article><article class=\"no\"><h3>Able to attend</h3><p>A home visit would not normally be required. Lack of transport alone would not normally be a reason for a visit.</p></article></div><div class=\"notice\"><strong>Do not make the final clinical decision.</strong> If the answer is unclear, pass the request to a clinician. If the patient is currently at the surgery, discuss them with the Navigating Clinician rather than processing a home-visit request.</div></section>\n\n      <section id=\"route\"><span class=\"eyebrow\">Routine workflow</span><h2>Record and route the request</h2><div class=\"steps\"><article class=\"step\"><h3>Record the problem</h3><p>Document the reason for the request and the information given by the caller.</p></article><article class=\"step\"><h3>Set expectations</h3><div class=\"script\"><q>A clinician will most likely call you back to discuss the symptoms. The clinician will decide whether a home visit is appropriate.</q></div><p>Do not promise that a visit will happen or give a visit time.</p></article><article class=\"step\"><h3>Add to the visiting clinician’s list</h3><p>Include the working contact number and enough information for the clinician to review the request.</p></article></div><div class=\"route\"><strong>If the Visiting Clinician has already left</strong>Discuss the request with the Navigating Clinician and follow their advice.</div></section>\n\n      <section id=\"late\"><span class=\"eyebrow\">Late-day route</span><h2>Requests after 5:00pm</h2><div class=\"route\"><strong>Add the request to the Duty Doctor’s screen</strong>Label it clearly: <strong>Home Visit Request</strong>.</div><p>Check the <a href=\"#/duty-doctor\">Duty Doctor 5:00–6:30pm protocol</a> for eligibility and the full late-day workflow.</p></section>\n\n      <section id=\"help\"><span class=\"eyebrow\">Support</span><h2>Can’t find what you need?</h2><div class=\"support\"><article><h3>Need an answer now?</h3><p>Speak to your Team Manager in the first instance. For an immediate clinical query, speak to the Navigating Clinician or Duty Doctor after 5pm where appropriate.</p></article><article><h3>Something missing or out of date?</h3><p>Let us know so we can improve the Staff Hub.</p><a class=\"button secondary\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></div></section>\n\n      <footer class=\"footer\"><p><strong>Source:</strong> Home Visit SOP supplied for Bradley’s Practice, with the agreed updated wording on a patient’s ability to attend surgery.</p><p><strong>Outstanding governance:</strong> confirm owner, approval date and review date.</p></footer>\n    </main>\n  </div>\n","script":""},"patient-access-guide":{"title":"Patient access and appointments | Bradley’s Practice","html":"<style>\n\n    :host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--red:#fff0ef;--red-ink:#8e2929;--amber:#fff4df;--amber-ink:#70450d;--blue:#eaf5fb;--green:#e7f5e0}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.top-inner{max-width:1200px;margin:auto;padding:15px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:700}.logo{width:170px;filter:brightness(0) invert(1)}.print{border:1px solid #b9d2ce;background:#fff;color:var(--brand);border-radius:10px;padding:8px 12px;font-weight:700}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;padding:34px 28px 70px}.contents{position:sticky;top:20px;align-self:start}.contents strong{display:block;margin-bottom:9px}.contents a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 11px;border-left:2px solid var(--line)}.contents a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 12px}h2{font-size:25px;line-height:1.2;margin:0 0 15px}h3{font-size:18px;margin:0 0 7px}.lead{font-size:18px;color:#49635f;max-width:820px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 27px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.status{color:#83500e;font-weight:700}section{scroll-margin-top:20px;margin:40px 0}.alert,.notice,.info{padding:15px 17px;border-radius:11px;margin:15px 0}.alert{background:var(--red);border-left:4px solid var(--red-ink)}.alert strong{color:var(--red-ink)}.notice{background:var(--amber);color:var(--amber-ink)}.info{background:var(--blue);color:#244e66}.flow{display:grid;gap:12px}.step{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.step p,.step ul{margin:7px 0}.step li{margin:5px 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.choice article:first-child{border-top:4px solid var(--brand2)}.choice article:last-child{border-top:4px solid #d79025}.routes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.route{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.route h3{font-size:17px}.route p,.route ul{margin:7px 0}.route li{margin:5px 0}.action{background:var(--green);padding:14px 16px;border-radius:11px;margin:12px 0}.related{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:750}.footer{border-top:1px solid var(--line);padding-top:19px;color:var(--muted);font-size:14px}.support{display:grid;grid-template-columns:1fr 1fr;gap:12px}.support article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}\n    @media(max-width:820px){.layout{display:block;padding:25px 17px 50px}.contents{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:26px}.contents a{display:inline-block;margin-right:10px}.logo{display:none}h1{font-size:31px}.routes,.choice,.support{grid-template-columns:1fr}.top-inner{padding:14px 17px}}@media print{.top,.contents,.print{display:none}.layout{display:block;max-width:none;padding:0}:host{background:#fff}.step,.route{break-inside:avoid}}\n  </style>\n  <header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/reception-guide\">← Reception Guide</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"><button class=\"print\" onclick=\"window.print()\">Print guide</button></div></header>\n  <div class=\"layout\">\n    <nav class=\"contents\" aria-label=\"Page contents\"><strong>Jump to</strong><a href=\"#/patient-access-guide/request\">Appointment request</a><a href=\"#/patient-access-guide/booking\">Book after triage</a><a href=\"#/patient-access-guide/no-appointments\">Appointment problems</a><a href=\"#/patient-access-guide/chronic-review\">Chronic disease</a><a href=\"#/patient-access-guide/sick-notes\">Sick notes</a><a href=\"#/patient-access-guide/blood-tests\">Blood tests</a><a href=\"#/patient-access-guide/results\">Results and measurements</a><a href=\"#/patient-access-guide/escalation\">Escalation</a></nav>\n    <main>\n      <header><span class=\"eyebrow\">Reception Guide · Patient access</span><h1>Appointments and clinical access</h1><p class=\"lead\">Use this page to help a patient request clinical care, action an appointment chosen by a clinician, or resolve a common booking problem.</p><div class=\"meta\"><span class=\"pill\">Reception and Clinical Admin</span><span class=\"pill\">Owner: to be confirmed</span><span class=\"pill status\">Review date required</span></div></header>\n\n      <div class=\"alert\"><strong>Do not complete an eConsult for an emergency.</strong><br>Advise the patient to call <strong>999</strong> for crushing chest pain or tightness, severe difficulty breathing, new one-sided weakness, inability to raise both arms, facial droop or slurred speech, heavy bleeding that will not stop, severe injuries, overdose or planned self-harm.</div>\n\n      <section id=\"request\"><span class=\"eyebrow\">Patient asks for clinical help</span><h2>Requesting an appointment</h2><div class=\"choice\"><article><h3>Patient can use the website</h3><p>Direct them through the Bradley’s Practice website and Zymego flow. Explain that it guides them to the right help and identifies symptoms needing prompt action.</p></article><article><h3>Patient cannot access it online</h3><p>Work through the website flow with the patient. If the endpoint requires an eConsult, complete an <strong>eConsult Lite</strong> for them.</p></article></div><div class=\"step\"><h3>For eConsult Lite, record</h3><ul><li>Main symptoms.</li><li>Location on the body, where relevant.</li><li>How long the symptoms have been present.</li><li>Whether a healthcare professional is already aware.</li><li>The patient’s desired outcome.</li></ul></div><div class=\"info\"><strong>Response time:</strong> tell the patient the practice will respond by <strong>6pm on the next working day</strong>.</div><div class=\"notice\"><strong>Dental problems:</strong> direct the patient to their own dentist or NHS 111.</div></section>\n\n      <section id=\"booking\"><span class=\"eyebrow\">After clinician triage</span><h2>Booking the allocated appointment</h2><div class=\"flow\"><article class=\"step\"><h3>1. Check whether a booking link has already been sent</h3><p>If a link has been sent, complete the eConsult. If the patient cannot receive a link—for example, a child or someone without a mobile number or email—contact them and book the specified appointment.</p></article><article class=\"step\"><h3>2. Action the request the same day</h3><p>The patient should know the outcome within 24 hours of the clinical decision. Book the appointment or send the link on the day the clinician requests it.</p></article></div><div class=\"routes\"><article class=\"route\"><h3>On the day</h3><p>Send a link, or telephone and explain that the patient has been triaged as needing assessment today.</p></article><article class=\"route\"><h3>Within the week</h3><p>Send a link, or telephone and explain that an urgent appointment is needed within the week.</p></article><article class=\"route\"><h3>A&E or MIU</h3><p>Send the appropriate template or telephone. Explain that a clinician has reviewed the information and the practice is not set up to manage the acute injury or problem.</p></article><article class=\"route\"><h3>Photo clinic</h3><p>Send a link or book manually. Explain that an HCA will take photographs of the skin lesion for GP review.</p></article><article class=\"route\"><h3>Nurse or audiology</h3><p>Send a link or telephone and book the specified appointment.</p></article><article class=\"route\"><h3>Query</h3><p>Book with the appropriate clinician, no more than three per clinician per day, and send the patient the agreed query message.</p></article></div></section>\n\n      <section id=\"zymego\"><span class=\"eyebrow\">Troubleshooting</span><h2>Patient cannot use their Zymego link</h2><div class=\"action\"><strong>Manually book the same appointment type for them.</strong></div></section>\n\n      <section id=\"no-appointments\"><span class=\"eyebrow\">Troubleshooting</span><h2>No matching appointment is available</h2><div class=\"flow\"><article class=\"step\"><h3>1. Search for the same appointment</h3><p>If you find a matching slot, book it for the patient.</p></article><article class=\"step\"><h3>2. Explain how availability changes</h3><p>New slots are added daily. Advise the patient to check again and explain Zymego’s earlier-appointment function.</p></article><article class=\"step\"><h3>3. Escalate if still unresolved</h3><p>Escalate the appointment problem to <strong>Emma Newton</strong>.</p></article></div></section>\n\n      <section id=\"cannot-attend\"><span class=\"eyebrow\">Troubleshooting</span><h2>Patient cannot attend the offered appointment</h2><div class=\"choice\"><article><h3>Cannot attend on the day</h3><p>Offer the next available clinical appointment within the week.</p></article><article><h3>Cannot attend within the week</h3><p>Offer a routine appointment.</p></article></div><div class=\"notice\">Advise the patient to contact the practice or NHS 111 if their condition worsens while waiting.</div><p>A patient may change an appointment to another of the same type. Encourage them to use Zymego, but change it manually if they cannot use the internet.</p></section>\n\n      <section id=\"preferred-clinician\"><span class=\"eyebrow\">Troubleshooting</span><h2>Patient wants a particular clinician</h2><p>Accommodate this when there is a suitable appointment of the required priority. Otherwise offer a choice:</p><div class=\"choice\"><article><h3>Wait for that clinician</h3><p>Offer the first available suitable appointment with the requested clinician. Advise the patient to contact the practice if they become more unwell while waiting.</p></article><article><h3>See someone sooner</h3><p>Offer an earlier suitable appointment with any clinician.</p></article></div><p>Document the choices offered and the patient’s decision.</p></section>\n\n      <section id=\"priority\"><span class=\"eyebrow\">Troubleshooting</span><h2>Patient is unhappy with the allocated priority</h2><ol><li>Explain that reception cannot change the urgency allocated by the clinician.</li><li>Ask whether anything has changed since the original contact and why they believe it is now more urgent.</li><li>Add the information to the original eConsult, or complete a new eConsult Lite if none exists.</li><li>Place it in the Clinical inbox for the Navigator to review.</li><li>Explain that the request will be considered, but the Navigator makes the decision.</li></ol></section>\n\n      <section id=\"no-answer\"><span class=\"eyebrow\">Troubleshooting</span><h2>Patient does not answer the phone</h2><div class=\"action\"><strong>Try three times, then send the Failed Encounter message template.</strong><br>If the patient returns the call, book the appointment.</div></section>\n\n      <section id=\"refuses-ae\"><span class=\"eyebrow\">Safety</span><h2>Patient refuses recommended A&E or MIU attendance</h2><ol><li>Explain that a clinician has advised A&E or MIU because it is considered the most appropriate place to provide the care needed.</li><li>If the patient says the original information was inaccurate or their condition has changed, record this in the notes or original eConsult.</li><li>Ask the patient to restart the Bradley’s Practice website and Zymego flow.</li></ol></section>\n\n      <section id=\"chronic-review\"><span class=\"eyebrow\">Common request</span><h2>Chronic disease review</h2><p>Reassure the patient that the practice will contact them for review in their birth month. If they received an online form but cannot complete it, book an appropriately timed nurse appointment using the current Zymego table.</p></section>\n\n      <section id=\"sick-notes\"><span class=\"eyebrow\">Common request</span><h2>Sick note request</h2><div class=\"routes\"><article class=\"route\"><h3>First seven days</h3><p>A sick note is not required for the first seven consecutive days of absence.</p></article><article class=\"route\"><h3>New sick note</h3><p>Ask the patient to follow the website and Zymego flow. If they cannot, complete eConsult Lite and record the medical condition prompting the request.</p></article><article class=\"route\"><h3>Extension</h3><p>Place the request as a query for the clinician who issued the previous sick note.</p></article><article class=\"route\"><h3>Not provided</h3><p>The practice does not issue sick notes for absence from education or provide “fit to work” assessments. Employment concerns should be discussed with the employer.</p></article></div></section>\n\n      <section id=\"blood-tests\"><span class=\"eyebrow\">Common request</span><h2>Patient asks for a blood test</h2><div class=\"routes\"><article class=\"route\"><h3>Requested by a practice clinician</h3><p>Print the existing WGP form or create a form only for the tests clearly recorded in a message, consultation or other entry. Ask the requesting clinician if the tests are unclear.</p></article><article class=\"route\"><h3>Requested by hospital</h3><p>The practice does not routinely perform tests for other departments. Normally decline. If the patient remains adamant, complete eConsult Lite for Navigator review.</p></article><article class=\"route\"><h3>Requested by a private clinic</h3><p>Decline. The private provider should arrange the tests and the patient is responsible for any charge.</p></article><article class=\"route\"><h3>Part of chronic disease review</h3><p>Check the recent Medlink entry for the required tests and generate the form accordingly.</p></article><article class=\"route\"><h3>Not requested by a clinician</h3><p>Direct the patient through the website and Zymego flow, or complete eConsult Lite if they cannot do so.</p></article></div></section>\n\n      <section id=\"results\"><span class=\"eyebrow\">Routing</span><h2>Results or measurements</h2><p>For information such as urine dipstick results or blood-pressure measurements, place a query with the clinician who requested it. If that is not possible, complete eConsult Lite with the details.</p></section>\n\n      <section id=\"escalation\"><span class=\"eyebrow\">Escalation</span><h2>Urgent or difficult situations</h2><div class=\"routes\"><article class=\"route\"><h3>Urgent or clinical problem</h3><p>Speak to any GP Partner. After 5pm, speak to the Duty Doctor.</p></article><article class=\"route\"><h3>Non-urgent problem with no other route</h3><p>Complete eConsult Lite with the details.</p></article><article class=\"route\"><h3>Unsure what to do</h3><p>Speak to your Team Manager. If unavailable, speak to the Navigating Clinician.</p></article><article class=\"route\"><h3>Home visit</h3><p>Use the separate Home Visit workflow, including the Duty Doctor route after 5pm.</p><a class=\"related\" href=\"#/home-visit-request\">Open Home Visit workflow</a></article></div></section>\n\n      <section><div class=\"support\"><article><h3>Need an answer now?</h3><p>Speak to your Team Manager first. For an immediate clinical query, speak to the Navigating Clinician or Duty Doctor after 5pm where appropriate.</p></article><article><h3>Something missing or out of date?</h3><p>Tell us so the Staff Hub can be improved.</p><a class=\"related\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></div></section>\n      <footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Patient Access Policy, supplemented by the confirmed emergency, response-time and escalation wording supplied for the Staff Hub.</p><p><strong>Governance:</strong> the newer Home Visit workflow remains authoritative where the Patient Access Policy contains older housebound wording.</p></footer>\n    </main>\n  </div>\n","script":""},"urgent-appointment-capacity":{"title":"Afternoon urgent appointment capacity | Bradley’s Practice","html":"<style>\n\n:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--amber:#fff4df;--green:#e7f5e0}*{box-sizing:border-box}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.top-inner{max-width:1000px;margin:auto;padding:15px 26px;display:flex;justify-content:space-between;align-items:center}.back{color:#d7ebe8;text-decoration:none;font-weight:700}.logo{width:175px;filter:brightness(0) invert(1)}main{max-width:820px;margin:auto;padding:40px 24px 70px}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 12px}h2{font-size:22px;margin:0 0 7px}.lead{font-size:18px;color:#49635f}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.steps{counter-reset:s;display:grid;gap:13px}.step{counter-increment:s;position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px 20px 19px 67px}.step:before{content:counter(s);position:absolute;left:19px;top:19px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:800}.step p{margin:5px 0}.rule{background:var(--green);padding:15px 17px;border-radius:11px;margin:15px 0}.caution{background:var(--amber);padding:15px 17px;border-radius:11px;margin:15px 0}.example{border-left:4px solid var(--brand2);background:#fff;padding:14px 16px;border-radius:9px;margin:15px 0}.footer{border-top:1px solid var(--line);margin-top:35px;padding-top:18px;color:var(--muted);font-size:14px}@media(max-width:600px){.top-inner{padding:14px 17px}.logo{display:none}main{padding:29px 17px 50px}h1{font-size:31px}}@media print{.top{display:none}main{max-width:none;padding:0}:host{background:#fff}.step{break-inside:avoid}}\n</style><header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/home\">← Staff hub</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"></div></header><main><header><span class=\"eyebrow\">Administrative workflow · Clinical Admin Team</span><h1>Afternoon urgent appointment capacity</h1><p class=\"lead\">Use this workflow at 12:30pm when urgent appointments remain unfilled for the afternoon.</p><div class=\"meta\"><span class=\"pill\">Run at 12:30pm</span><span class=\"pill\">Owner: Clinical Admin Team</span><span class=\"pill\">Review date required</span></div></header><div class=\"steps\"><article class=\"step\"><h2>Check for outstanding appointment requests</h2><p>Review tasks and make sure there are no outstanding patient requests that need an appointment before changing any appointment types.</p></article><article class=\"step\"><h2>Count the available urgent appointments</h2><p>Count the urgent appointments still available for the afternoon.</p></article><article class=\"step\"><h2>Keep 15 urgent appointments</h2><p>If more than 15 remain, calculate the number in excess of 15.</p></article><article class=\"step\"><h2>Convert only the excess</h2><p>Change the excess appointments to an appropriate mix of <strong>routine</strong> and <strong>within-the-week</strong> appointments.</p></article></div><div class=\"rule\"><strong>Do not change an appointment unless it is more than two hours in the future.</strong></div><div class=\"example\"><strong>Example:</strong> if 18 urgent afternoon appointments are available, convert three to a mix of routine and within-the-week appointments, leaving 15 urgent appointments.</div><div class=\"caution\"><strong>Use a pragmatic approach.</strong> This workflow manages unused capacity after outstanding appointment requests have been checked; it is not a route for changing a patient’s clinician-allocated priority.</div><footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Patient Access Policy, Unfilled Appointments section.</p><p><strong>Governance action:</strong> confirm owner, approval date and review date.</p></footer></main>","script":""},"reception-common-queries":{"title":"Everyday reception queries | Bradley’s Practice","html":"<style>\n\n:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--blue:#eaf5fb;--amber:#fff4df}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.top-inner{max-width:1080px;margin:auto;padding:15px 26px;display:flex;align-items:center;justify-content:space-between}.back{color:#d7ebe8;text-decoration:none;font-weight:700}.logo{width:175px;filter:brightness(0) invert(1)}main{max-width:900px;margin:auto;padding:38px 24px 70px}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 12px}h2{font-size:24px;margin:0 0 12px}.lead{font-size:18px;color:#49635f}.jump{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 34px}.jump a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--brand);text-decoration:none;font-weight:700}section{scroll-margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px;margin:15px 0}.action{background:#e7f5e0;border-radius:10px;padding:13px 15px;margin:12px 0}.info{background:var(--blue);border-radius:10px;padding:13px 15px;margin:12px 0}.warning{background:var(--amber);border-radius:10px;padding:13px 15px;margin:12px 0}.button{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:750}.footer{border-top:1px solid var(--line);margin-top:32px;padding-top:18px;color:var(--muted);font-size:14px}@media(max-width:600px){.top-inner{padding:14px 17px}.logo{width:145px}main{padding:28px 17px 50px}h1{font-size:31px}}\n</style><header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/reception-guide\">← Reception Guide</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"></div></header><main><header><span class=\"eyebrow\">Reception Guide · Administrative queries</span><h1>Everyday reception queries</h1><p class=\"lead\">Short routes for common requests that do not require the full Patient Access workflow.</p></header><nav class=\"jump\" aria-label=\"Page contents\"><a href=\"#/reception-common-queries/prescriptions\">Prescriptions</a><a href=\"#/reception-common-queries/referrals\">Referral updates</a><a href=\"#/reception-common-queries/forms\">ADHD and autism forms</a><a href=\"#/reception-common-queries/private-work\">Private work</a><a href=\"#/reception-common-queries/complaints\">Complaints</a></nav>\n<section id=\"prescriptions\"><span class=\"eyebrow\">Prescription query</span><h2>Requesting repeat medication</h2><div class=\"action\"><strong>First choice: encourage the patient to use the NHS App.</strong></div><p>If the patient cannot use the NHS App, they can:</p><ul><li>Request medication through their pharmacy.</li><li>Send a written request to the practice.</li><li>Email the Prescription Team.</li></ul><a class=\"button\" href=\"mailto:Prescriptions.W00076@wales.nhs.uk\">Email Prescription Team</a><div class=\"warning\">This route explains how to submit a request. It does not promise that medication will be prescribed or issued immediately.</div></section>\n<section id=\"referrals\"><span class=\"eyebrow\">Referral update</span><h2>Patient asks for an update on a referral</h2><div class=\"action\"><strong>Direct the patient to the hospital service they were referred to.</strong></div><p>The hospital service holds the current information about its waiting list and appointment arrangements.</p></section>\n<section id=\"forms\"><span class=\"eyebrow\">Forms</span><h2>ADHD or autism assessment forms</h2><p>Patients can collect the relevant assessment forms from the surgery.</p></section>\n<section id=\"private-work\"><span class=\"eyebrow\">Non-NHS work</span><h2>Private work request</h2><p>Patients can complete a private work request form at the surgery. Information about the applicable cost and how to pay is also available at the surgery.</p></section>\n<section id=\"complaints\"><span class=\"eyebrow\">Complaints</span><h2>Patient is unhappy or wants to complain</h2><ol><li>Try to de-escalate and resolve the concern at the time where possible.</li><li>If this is not possible, pass the matter to your line manager.</li><li>If the patient wants to make a formal complaint, ask them to email the Complaints Team.</li></ol><a class=\"button\" href=\"mailto:complaints.W00076@wales.nhs.uk\">Email Complaints Team</a><div class=\"info\">Record and escalate any immediate patient-safety concern through the appropriate clinical route; do not wait for the formal complaint process.</div></section>\n<section><span class=\"eyebrow\">Feedback</span><h2>Something missing or out of date?</h2><p>Tell us so we can improve the Staff Hub.</p><a class=\"button\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></section><footer class=\"footer\"><p><strong>Owner:</strong> to be confirmed · <strong>Last reviewed:</strong> not supplied · <strong>Next review:</strong> review date required.</p></footer></main>","script":""},"secondary-private-requests":{"title":"Secondary care and private provider requests | Bradley’s Practice","html":"<style>\n\n    :host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--amber:#fff4df;--blue:#eaf5fb;--red:#fff0ef;--red-ink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.top-inner{max-width:1120px;margin:auto;padding:15px 27px;display:flex;justify-content:space-between;align-items:center;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:700}.logo{width:174px;filter:brightness(0) invert(1)}.layout{max-width:1120px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px;padding:36px 27px 70px}.contents{position:sticky;top:22px;align-self:start}.contents strong{display:block;margin-bottom:9px}.contents a{display:block;color:var(--muted);text-decoration:none;padding:7px 0 7px 11px;border-left:2px solid var(--line)}.contents a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 13px}h2{font-size:25px;line-height:1.2;margin:0 0 15px}h3{font-size:18px;margin:0 0 7px}.lead{font-size:18px;color:#49635f;max-width:780px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}section{scroll-margin-top:22px;margin:39px 0}.question{font-size:20px;font-weight:800;margin:22px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.card p,.card ul{margin:7px 0}.decision{display:inline-block;border-radius:999px;padding:5px 10px;background:var(--green);color:#285b33;font-weight:800;font-size:13px;margin-bottom:10px}.decline{background:var(--red);color:var(--red-ink)}.review{background:var(--amber);color:#70450d}.principle{background:var(--blue);color:#244e66;padding:16px 18px;border-radius:11px;margin:16px 0}.principle strong{display:block;margin-bottom:5px}.escalate{background:var(--amber);color:#70450d;padding:16px 18px;border-radius:11px;margin:18px 0}.emis{background:#fff;border-left:4px solid var(--brand2);padding:15px 17px;border-radius:10px;margin:18px 0}.related{display:inline-block;background:var(--brand);color:#fff;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:750}.footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px}\n    @media(max-width:780px){.layout{display:block;padding:26px 17px 50px}.contents{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:25px}.contents a{display:inline-block;margin-right:10px}.logo{display:none}h1{font-size:31px}.grid{grid-template-columns:1fr}.top-inner{padding:14px 17px}}@media print{.top,.contents{display:none}.layout{display:block;max-width:none;padding:0}:host{background:#fff}.card{break-inside:avoid}}\n  </style>\n  <header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/reception-guide\">← Reception Guide</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"></div></header>\n  <div class=\"layout\">\n    <nav class=\"contents\" aria-label=\"Page contents\"><strong>What are we being asked to do?</strong><a href=\"#/secondary-private-requests/medication\">Prescribe medication</a><a href=\"#/secondary-private-requests/investigations\">Arrange investigations</a><a href=\"#/secondary-private-requests/results\">Chase or action results</a><a href=\"#/secondary-private-requests/private-care\">Private shared care</a><a href=\"#/secondary-private-requests/uncertain\">If uncertain</a></nav>\n    <main>\n      <header><span class=\"eyebrow\">Reception Guide · Administrative workflow</span><h1>Secondary care and private provider requests</h1><p class=\"lead\">Use this page when another healthcare provider asks Bradley’s Practice to prescribe, investigate, monitor or follow something up.</p><div class=\"meta\"><span class=\"pill\">Reception and Admin</span><span class=\"pill\">Owner: to be confirmed</span><span class=\"pill\">Review date required</span></div></header>\n\n      <div class=\"escalate\"><strong>Do not make a clinical judgement about whether an exception applies.</strong><br>If the request does not clearly fit one of the routes below, or you are unsure, ask your <strong>line manager</strong>.</div>\n\n      <section id=\"medication\"><span class=\"eyebrow\">Medication</span><h2>Are we being asked to prescribe?</h2><div class=\"grid\"><article class=\"card\"><span class=\"decision review\">Clinician review</span><h3>Ongoing or repeat medication</h3><p>Add the request to <strong>Prescription Queries</strong> for clinician review.</p><p>This is for consideration only. Do not promise that the practice will prescribe or take over treatment.</p></article><article class=\"card\"><span class=\"decision decline\">Decline</span><h3>Acute or one-off medication from a private provider</h3><p>The private provider responsible for the episode of care should prescribe the acute or one-off treatment.</p></article></div></section>\n\n      <section id=\"investigations\"><span class=\"eyebrow\">Tests and monitoring</span><h2>Are we being asked to arrange investigations?</h2><div class=\"grid\"><article class=\"card\" id=\"secondary-care\"><span class=\"decision decline\">Normally decline</span><h3>Requested by secondary care</h3><p>Secondary care should arrange investigations required as part of its diagnostic or treatment pathway.</p><p>If clinical staff confirm that an agreed practice pathway applies, follow their instruction. Reception and admin staff are not expected to maintain or interpret a pathway list.</p></article><article class=\"card\"><span class=\"decision decline\">Decline</span><h3>Requested by a private provider</h3><p>The private provider should arrange the investigations required for the care it is providing, including any associated costs.</p></article></div></section>\n\n      <section id=\"results\"><span class=\"eyebrow\">Result responsibility</span><h2>Are we being asked to chase, communicate or action a result?</h2><div class=\"principle\"><strong>The service that requested the investigation remains responsible.</strong>It must chase and receive the result, decide and undertake the required action or management plan, and communicate the result to the patient.</div><p>Responsibility transfers only when there has been prior agreement and Bradley’s Practice has accepted it. Sending a letter or request does not, by itself, transfer responsibility.</p></section>\n\n      <section id=\"private-care\"><span class=\"eyebrow\">Private care</span><h2>Is this a private shared-care request?</h2><div class=\"card\"><span class=\"decision decline\">Do not accept</span><h3>Private shared care</h3><p>Bradley’s Practice does not enter into shared-care agreements with private clinics.</p><p>If a patient has been discharged from private care and wants the condition managed through the NHS, route the patient through the normal clinical-access process.</p></div></section>\n\n      <section id=\"uncertain\"><span class=\"eyebrow\">Uncertainty and responses</span><h2>What if the request is unclear?</h2><div class=\"escalate\"><strong>Escalate to your line manager.</strong><br>Do not automatically accept or decline a request where you are unsure whether an agreed arrangement applies.</div><div class=\"emis\"><strong>Standard response letters</strong><br>If a written response is needed, the relevant standard letters are available in the <strong>Documents</strong> section of the patient’s notes in EMIS. They are not reproduced on this page.</div><a class=\"related\" href=\"#/patient-access-guide/blood-tests\">Related: patient asks for a blood test</a></section>\n\n      <section><span class=\"eyebrow\">Feedback</span><h2>Something missing or out of date?</h2><p>Use the short feedback form to suggest an update or flag unclear guidance.</p><a class=\"button secondary\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></section>\n\n      <footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice agreed workflow and its standard responses for secondary-care investigations, secondary-care results and private care.</p><p><strong>Governance action:</strong> confirm owner, approval date and review date.</p></footer>\n    </main>\n  </div>\n","script":""},"patient-death-notification":{"title":"Patient death notification policy | Bradley’s Practice","html":"<style>\n\n    :host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--blue-bg:#eaf5fb;--amber:#8b5108;--amber-bg:#fff4df;--red:#9b2c2c;--red-bg:#fff0ef}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.58 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}a{color:var(--brand2)}.top{background:var(--brand);color:#fff}.top-inner{max-width:1160px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.back{color:#d7ebe8;text-decoration:none;font-weight:650}.practice{font-size:14px;color:#c2dbd7}.layout{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:245px minmax(0,1fr);gap:34px;padding:36px 28px 70px}.contents{position:sticky;top:24px;align-self:start}.contents strong{display:block;margin-bottom:10px}.contents a{display:block;color:var(--muted);text-decoration:none;padding:7px 0 7px 12px;border-left:2px solid var(--line)}.contents a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.hero h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 14px}.lead{font-size:18px;color:#49635f;max-width:760px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.alert{border-left:4px solid var(--red);background:var(--red-bg);padding:15px 17px;border-radius:10px;margin:25px 0}.alert strong{display:block;color:var(--red);margin-bottom:3px}.decision{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 35px}.decision article{border:1px solid var(--line);border-radius:15px;padding:18px;background:#fff}.decision b{display:block;font-size:17px;margin-bottom:5px}.decision p{margin:0;color:var(--muted)}section{scroll-margin-top:25px;margin:40px 0}h2{font-size:25px;letter-spacing:-.02em;margin:0 0 16px;padding-top:2px}h3{font-size:18px;margin:24px 0 10px}.steps{list-style:none;padding:0;margin:0;counter-reset:item}.steps li{counter-increment:item;position:relative;padding:0 0 23px 52px;min-height:42px}.steps li:before{content:counter(item);position:absolute;left:0;top:0;width:34px;height:34px;display:grid;place-items:center;background:#e3f1ee;color:var(--brand);border-radius:10px;font-weight:800}.steps li:not(:last-child):after{content:\"\";position:absolute;left:16px;top:38px;height:calc(100% - 37px);border-left:2px solid #d4e5e2}.steps b{display:block;margin-bottom:3px}.note{background:var(--blue-bg);color:#244e66;padding:14px 16px;border-radius:10px;margin:13px 0}.warning{background:var(--amber-bg);color:#69410d;padding:14px 16px;border-radius:10px;margin:13px 0}.checklist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 20px;margin:14px 0}.checklist li{margin:9px 0}.contact{display:grid;grid-template-columns:1fr 1fr;gap:14px}.contact article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.contact span{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}.contact a{font-weight:750;text-decoration:none}.contact p{margin:0;color:var(--muted)}.footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:14px}.status{color:var(--amber);font-weight:700}.print{border:1px solid #b9d2ce;background:#fff;color:var(--brand);border-radius:10px;padding:8px 12px;font-weight:700}.print:hover{background:#edf6f4}\n    @media(max-width:760px){.layout{display:block;padding:25px 17px 50px}.contents{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:28px}.contents a{display:inline-block;margin-right:12px}.hero h1{font-size:31px}.decision,.contact{grid-template-columns:1fr}.top-inner{padding:14px 17px}.practice{display:none}}@media print{.top,.contents,.print{display:none}.layout{display:block;max-width:none;padding:0}.hero h1{font-size:29px}:host{background:#fff}.alert,.note,.warning{border:1px solid #bbb}.decision article,.contact article{break-inside:avoid}}\n  </style>\n  <header class=\"top\"><div class=\"top-inner\"><a class=\"back\" href=\"#/home\">← Staff hub</a><span class=\"practice\">Bradley’s Practice · Mold and Buckley</span><button class=\"print\" onclick=\"window.print()\">Print policy</button></div></header>\n  <div class=\"layout\">\n    <nav class=\"contents\" aria-label=\"Policy contents\"><strong>On this page</strong><a href=\"#/patient-death-notification/first\">Immediate action</a><a href=\"#/patient-death-notification/reception\">Reception</a><a href=\"#/patient-death-notification/secretaries\">Secretaries</a><a href=\"#/patient-death-notification/doctors\">Doctors</a><a href=\"#/patient-death-notification/contacts\">Contacts</a></nav>\n    <main>\n      <header class=\"hero\"><span class=\"eyebrow\">Practice policy</span><h1>When the practice is informed of a patient’s death</h1><p class=\"lead\">Follow this procedure whenever the practice receives notification that a patient has died. It ensures the death is verified where necessary, recorded consistently, allocated promptly for certification and notified to the Medical Examiner’s Office.</p><div class=\"meta\"><span class=\"pill\">Receptionists, secretaries and doctors</span><span class=\"pill\">Owner: Clinical governance</span><span class=\"pill status\">Review date to be confirmed</span></div></header>\n      <div class=\"alert\"><strong>Act promptly</strong>If there is any doubt about whether the death has been verified, place the patient on the visiting clinician screen. Do not start the certification workflow until verification is confirmed.</div>\n      <section id=\"first\"><h2>First decision</h2><div class=\"decision\"><article><b>The death has been verified</b><p>Complete the EMIS Death Notification protocol, then send an urgent task to the secretaries.</p></article><article><b>The death has not been verified</b><p>Place the patient on the visiting clinician screen so that verification can be arranged.</p></article></div></section>\n      <section id=\"reception\"><span class=\"eyebrow\">Role workflow</span><h2>Receptionists</h2><ol class=\"steps\"><li><b>Establish whether the death has been verified</b>If it has not been verified, place the patient on the visiting clinician screen.</li><li><b>Record the death in EMIS</b>Once verification is confirmed, complete the Death Notification protocol in the patient’s record.</li><li><b>Notify the secretaries</b>Send an <strong>urgent</strong> task informing them of the death.</li><li><b>Handle a paper MCCD securely</b>At Mold, pass it directly to the secretaries. At Buckley, pass it to the scanning team so it can be forwarded electronically to the secretaries.</li></ol></section>\n      <section id=\"secretaries\"><span class=\"eyebrow\">Role workflow</span><h2>Secretaries</h2><h3>Allocate the Medical Certificate of Cause of Death</h3><ol class=\"steps\"><li><b>Identify the most appropriate GP</b>Ideally, allocate the MCCD to the GP who last saw the patient alive. It may be completed by another GP who has previously seen the patient alive.</li><li><b>Check availability within 48 hours</b>If an appropriate GP is working within the next 48 hours, place the case on their Query screen and inform them verbally.</li><li><b>Escalate if no appropriate GP is available</b>Place the case on the Navigator’s list. The Navigator must identify an appropriate GP or complete the MCCD themselves.</li></ol><h3>Send the case to the Medical Examiner’s Office</h3><p>When the completed MCCD is received, email the Medical Examiner’s Office with:</p><ul class=\"checklist\"><li>the previous six months of consultations, or the last 10 consultations, using the Medical Examiner report print template in EMIS;</li><li>all information recorded in the Death Notification template;</li><li>the completed MCCD; and</li><li>the Medical Examiner referral form, if it has been saved in the patient’s EMIS record.</li></ul><div class=\"note\"><strong>Keep the original MCCD securely.</strong> It does not need to be sent to the family or the register office.</div><p>If the Medical Examiner’s Office raises an issue, discuss it with the GP who completed the original certificate wherever possible. If that GP will not be in within 24 hours, discuss it with another GP.</p></section>\n      <section id=\"doctors\"><span class=\"eyebrow\">Role workflow</span><h2>Doctors</h2><h3>After verifying a death</h3><ol class=\"steps\"><li><b>Complete the EMIS Death Notification protocol</b>Record the required details in the patient’s notes.</li><li><b>Notify the secretaries</b>Send an <strong>urgent</strong> task informing them of the death.</li></ol><h3>Certification and referral</h3><ol class=\"steps\"><li><b>Decide whether the death is reportable to the Coroner</b>If it is, report the death directly to the Coroner using the current referral process.</li><li><b>Complete the Medical Examiner referral</b>If the death is not being referred to the Coroner, complete the Medical Examiner referral document from the patient’s EMIS record or <a href=\"https://forms.cloud.microsoft/pages/responsepage.aspx?id=uChWuyjjgkCoVkM8ntyPrv8FYfYLtMBBkZEJc9hYdKZUNEY5SENERVpMV1JaSUkzT1paT0VDREJaVS4u\" target=\"_blank\" rel=\"noopener\">open the North Wales Medical Examiner QAP form ↗</a>.</li><li><b>Use the correct contact email</b>Enter <a href=\"mailto:admin.w00076@wales.nhs.uk\">admin.w00076@wales.nhs.uk</a> as the contact email on the online form.</li><li><b>Complete the MCCD immediately</b>Leave the original securely at reception or pass it directly to the secretaries.</li><li><b>Document an electronic referral</b>Record in the patient’s notes that the Medical Examiner referral has been completed and document the proposed cause of death.</li></ol><div class=\"warning\"><strong>Coroner referral:</strong> use the current approved Coroner referral form. The form embedded in the previous Word version has not been reproduced on this page.</div></section>\n      <section id=\"contacts\"><span class=\"eyebrow\">Useful contacts</span><h2>Medical Examiner’s Office</h2><div class=\"contact\"><article><span>Telephone</span><a href=\"tel:01745366900\">01745 366900</a></article><article><span>Clinical referral email</span><a href=\"mailto:admin.w00076@wales.nhs.uk\">admin.w00076@wales.nhs.uk</a></article><article><span>North Wales MEO information</span><a href=\"https://nhswales365.sharepoint.com/sites/SSP_Intranet/SitePages/Medical-Examiner-Service.aspx?referrer=Yammer&amp;referrerScenario=Feed.View\" target=\"_blank\" rel=\"noopener\">Open NHS Wales intranet page ↗</a></article><article><span>Online MEO referral</span><a href=\"https://forms.cloud.microsoft/pages/responsepage.aspx?id=uChWuyjjgkCoVkM8ntyPrv8FYfYLtMBBkZEJc9hYdKZUNEY5SENERVpMV1JaSUkzT1paT0VDREJaVS4u\" target=\"_blank\" rel=\"noopener\">Open North Wales Medical Examiner QAP form ↗</a></article></div></section>\n      <footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice procedure for death notification. This web version has been reformatted for clarity; the operational steps have been retained.</p><p><strong>Governance action:</strong> confirm the policy owner, approval date and review date, and replace legacy local-file links with centrally accessible resources.</p></footer>\n    </main>\n  </div>\n","script":""},"medlink-recall":{"title":"Medlink chronic disease recall and review | Bradley’s Practice","html":"<style>:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--amber:#fff4df;--blue:#eaf5fb;--red:#fff0ef;--redink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.topin{max-width:1160px;margin:auto;padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:750}.logo{width:174px;filter:brightness(0) invert(1)}.layout{max-width:1160px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:35px;padding:36px 26px 70px}.toc{position:sticky;top:22px;align-self:start}.toc strong{display:block;margin-bottom:9px}.toc a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 11px;border-left:2px solid var(--line)}.toc a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 13px}h2{font-size:25px;line-height:1.2;margin:0 0 15px}h3{font-size:18px;margin:0 0 7px}.lead{font-size:18px;color:#49635f;max-width:800px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.status{color:#83500e;font-weight:750}section{scroll-margin-top:22px;margin:39px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.grid.three{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.card p,.card ul,.card ol{margin:7px 0}.card li{margin:5px 0}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--green);color:#285b33;font-weight:800;font-size:13px;margin-bottom:9px}.tag.warn{background:var(--amber);color:#70450d}.tag.red{background:var(--red);color:var(--redink)}.note,.warning,.alert,.action{padding:15px 17px;border-radius:11px;margin:15px 0}.note{background:var(--blue);color:#244e66}.warning{background:var(--amber);color:#70450d}.alert{background:var(--red);border-left:4px solid var(--redink)}.action{background:var(--green)}.steps{counter-reset:s;display:grid;gap:12px}.step{counter-increment:s;position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 19px 18px 64px}.step:before{content:counter(s);position:absolute;left:18px;top:18px;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:800}.step p{margin:5px 0}.button{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:750}.button.alt{background:#fff;color:var(--brand);border:1px solid #b9d2ce}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tabs a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--brand);text-decoration:none;font-weight:750}details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}summary{cursor:pointer;font-weight:800}.tablewrap{overflow:auto}.quicktable{width:100%;border-collapse:collapse;background:#fff}.quicktable th,.quicktable td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.quicktable th{background:var(--brand);color:#fff}.feedback{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:42px}.feedback article{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.feedback p{color:var(--muted)}.footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px;margin-top:35px}@media(max-width:820px){.layout{display:block;padding:25px 17px 50px}.toc{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:25px}.toc a{display:inline-block;margin-right:10px}.logo{display:none}h1{font-size:31px}.grid,.grid.three,.feedback{grid-template-columns:1fr}.topin{padding:14px 17px}}@media print{.top,.toc,.feedback{display:none}.layout{display:block;max-width:none;padding:0}:host{background:#fff}.card,.step{break-inside:avoid}}\n\n</style><header class=\"top\"><div class=\"topin\"><a class=\"back\" href=\"#/home\">← Staff hub</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"></div></header><div class=\"layout\"><nav class=\"toc\"><strong>Jump to</strong><a href=\"#/medlink-recall/flow\">Three pathways</a><a href=\"#/medlink-recall/reception\">Reception</a><a href=\"#/medlink-recall/nursing\">Nursing team</a><a href=\"#/medlink-recall/admin\">Admin team</a><a href=\"#/medlink-recall/monthly\">Monthly task</a></nav><main><header><span class=\"eyebrow\">Administrative and operational protocol</span><h1>Medlink chronic disease recall and review</h1><p class=\"lead\">One authoritative workflow for invitations, returned forms, nursing review, follow-up and completion.</p><div class=\"meta\"><span class=\"pill\">Reception · Nursing · Admin</span><span class=\"pill\">Owner: Nurse Manager / Pharmacist</span><span class=\"pill status\">Review date required</span></div></header><div class=\"note\"><strong>Role split:</strong> Admin manages recalls, invitations and workflow, then assigns every completed clinical form to Nurse Recall Triage. The nursing team reviews every returned form.</div><section id=\"flow\"><span class=\"eyebrow\">Nurse Recall Triage</span><h2>Choose one of three pathways</h2><div class=\"grid three\"><article class=\"card\"><span class=\"tag\">1 · Complete</span><h3>Review complete</h3><p>All required information is available and the condition is satisfactorily managed.</p><ul><li>Complete the review.</li><li>Check the medication list and reauthorise relevant medicines for 12 months.</li><li>Send the Medlink “Review satisfactory” message.</li></ul></article><article class=\"card\"><span class=\"tag warn\">2 · More information</span><h3>Do not complete yet</h3><p>Information is missing or outdated, such as BP, blood tests, patient response or HCA measurements.</p><ul><li>Use the most efficient route to obtain it.</li><li>Add a note where follow-up is awaited.</li><li>Reassess once received.</li></ul></article><article class=\"card\"><span class=\"tag red\">3 · Clinical concern</span><h3>Escalate</h3><p>The condition is not adequately managed, the response is concerning, or there is a red flag.</p><ul><li>Arrange appropriate nurse or GP review.</li><li>Prioritise according to clinical concern.</li><li>Document clearly.</li></ul></article></div></section><section><div class=\"tabs\"><a href=\"#/medlink-recall/reception\">Reception</a><a href=\"#/medlink-recall/nursing\">Nursing team</a><a href=\"#/medlink-recall/admin\">Admin team</a></div></section><section id=\"reception\"><span class=\"eyebrow\">Role guidance</span><h2>Reception</h2><div class=\"grid\"><article class=\"card\"><h3>When is my review due?</h3><p>Reassure the patient that the practice will contact them in their birth month.</p></article><article class=\"card\"><h3>Asked to collect a blood form</h3><p>Check the Medlink consultation note for the required tests, complete the form and select the GP who is Duty that day.</p></article><article class=\"card\"><h3>Cannot complete the electronic form</h3><p>Book or send a Zymego link for an appropriately timed nurse appointment. Appointment length depends on the number of conditions. Complete the blood form at the same time.</p></article></div></section><section id=\"nursing\"><span class=\"eyebrow\">Role guidance</span><h2>Nursing team</h2><ol><li>Allocate an initial session per nurse each week; average review time is expected to be five minutes.</li><li>Filter Physical Checks to “Completed” and Assigned to “Nurse Team”.</li><li>Review the returned form and EMIS record for accuracy and completeness.</li><li>Select pathway 1, 2 or 3 and document the action.</li><li>Escalate concerns to the Nurse Manager or Pharmacist.</li><li>At month end, report incomplete reviews to the Nurse Manager or Pharmacist.</li></ol><div class=\"note\">Information may be obtained by reply-enabled iPlato SMS, telephone, or a Zymego HCA appointment. Add a note to the form when waiting for a reply.</div></section><section id=\"admin\"><span class=\"eyebrow\">Role guidance</span><h2>Admin team</h2><ol><li>In the Inbox, filter Days in queue to “30–60” and Physical Checks to “Pending”.</li><li>Open the form and check Physical Checks for outstanding investigations.</li><li>Remember that Medlink has already sent reminders.</li><li>Contact the patient to offer help booking outstanding investigations.</li><li>If investigations are declined, pass the patient to the Lead Nurse for review.</li></ol></section><section id=\"monthly\"><span class=\"eyebrow\">Prominent monthly task</span><h2>Third week of each month</h2><div class=\"action\"><strong>Download the CSV for the previous month from Recall → Calendar.</strong></div><div class=\"grid\"><article class=\"card\"><h3>ACTION REQUIRED · Not invited</h3><p>Pass care-home and housebound patients to the cluster chronic disease nurse.</p></article><article class=\"card\"><h3>INFO · Invited</h3><p>Contact patients to arrange review manually. Offer an ad-hoc electronic form; otherwise book a nurse appointment and the appropriate blood tests.</p></article></div></section><div class=\"warning\"><strong>Safety:</strong> escalate uncertainty, follow high-risk medication protocols, and audit completion and safety outcomes.</div><section class=\"feedback\"><article><h3>Can’t find what you need?</h3><p>Speak to your Team Manager. For an immediate clinical query, speak to the Navigating Clinician or Duty Doctor after 5pm.</p></article><article><h3>Something missing or out of date?</h3><p>Tell us so the Staff Hub can be improved.</p><a class=\"button\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></section><footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Medlink protocol, MedLink Automated Recall Protocol and One Page SOP.</p><p><strong>Last reviewed:</strong> not supplied · <strong>Next review:</strong> review date required.</p></footer></main></div>","script":""},"medication-reauthorisation":{"title":"Repeat medication review and reauthorisation | Bradley’s Practice","html":"<style>:host{--ink:#18312f;--muted:#627672;--paper:#f5f8f7;--brand:#0d4f4b;--brand2:#157a72;--line:#dce6e3;--green:#e7f5e0;--amber:#fff4df;--blue:#eaf5fb;--red:#fff0ef;--redink:#8e2929}*{box-sizing:border-box}html{scroll-behavior:smooth}:host{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}.top{background:var(--brand);color:#fff}.topin{max-width:1160px;margin:auto;padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.back{color:#d7ebe8;text-decoration:none;font-weight:750}.logo{width:174px;filter:brightness(0) invert(1)}.layout{max-width:1160px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:35px;padding:36px 26px 70px}.toc{position:sticky;top:22px;align-self:start}.toc strong{display:block;margin-bottom:9px}.toc a{display:block;color:var(--muted);text-decoration:none;padding:6px 0 6px 11px;border-left:2px solid var(--line)}.toc a:hover{color:var(--brand);border-color:var(--brand2)}.eyebrow{color:var(--brand2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}h1{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin:8px 0 13px}h2{font-size:25px;line-height:1.2;margin:0 0 15px}h3{font-size:18px;margin:0 0 7px}.lead{font-size:18px;color:#49635f;max-width:800px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.status{color:#83500e;font-weight:750}section{scroll-margin-top:22px;margin:39px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.grid.three{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px dback p{color:var(--muted)}.footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px;margin-top:35px}@media(max-width:820px){.layout{display:block;padding:25px 17px 50px}.toc{position:static;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:25px}.toc a{display:inline-block;margin-right:10px}.logo{display:none}h1{font-size:31px}.grid,.grid.three,.feedback{grid-template-columns:1fr}.topin{padding:14px 17px}}@media print{.top,.toc,.feedback{display:none}.layout{display:block;max-width:none;padding:0}:host{background:#fff}.card,.step{break-inside:avoid}}\n\n</style><header class=\"top\"><div class=\"topin\"><a class=\"back\" href=\"#/home\">← Staff hub</a><img class=\"logo\" src=\"__BRADLEYS_LOGO__\" alt=\"Bradley’s Practice\"></div></header><div class=\"layout\"><nav class=\"toc\"><strong>Choose a route</strong><a href=\"#/medication-reauthorisation/route1\">No routine review</a><a href=\"#/medication-reauthorisation/route2\">Chronic disease</a><a href=\"#/medication-reauthorisation/route3\">Own review</a><a href=\"#/medication-reauthorisation/route4\">Remote review</a><a href=\"#/medication-reauthorisation/route5\">Blood monitoring</a><a href=\"#/medication-reauthorisation/route6\">Everything else</a></nav><main><header><span class=\"eyebrow\">Administrative and medicines-management protocol</span><h1>Repeat medication review and reauthorisation</h1><p class=\"lead\">Choose the correct route when a repeat medicine needs reauthorisation.</p><div class=\"meta\"><span class=\"pill\">Prescription Team</span><span class=\"pill status\">Review date required</span></div></header><section><div class=\"grid\"><article class=\"card\" id=\"route1\"><span class=\"tag\">Route 1</span><h3>Does not require routine review</h3><p>Suitable medicines may have 50 issues. Clinicians should set 50 issues when initiating; the Prescription Team may update the issue count where authorised.</p><details><summary>Search the approved 50-issue list</summary><p>Emollients; Adcal D3; Beconase; Calcichew and equivalent brands; Betahistine; Carbocisteine; Bisacodyl; Cetirizine; Bimatoprost; Chlorphenamine; Brinzolamide; Cinnarizine; Buscopan; Colecalciferol; vitamin B12; Cyanocobalamin; Cyclizine; Docusate; Esomeprazole; Fexofenadine; Finasteride; Fybogel; Gaviscon; Hyoscine butylbromide; Hyoscine hydrobromide; Ispaghula husk; Kwells; Lactulose; Lansoprazole; Latanoprost; Letrozole depending on end date; Loperamide; Loratadine; Lumigan; Macrogol; Mebeverine; Memantine; Omeprazole; Oxybutynin; Pantoprazole; Paracetamol; Peppermint oil; Senna; Tadalafil; Sildenafil; Tamsulosin; Solifenacin; Thiamine; Sumatriptan; Tranexamic acid; Vaginal oestrogen.</p></details><details><summary>Medicines not suitable for 50 issues</summary><p>Acute or short-term drugs; analgesia; antibiotics unless asplenic; short-term anticoagulants for PE; antidepressants; antipsychotics; controlled drugs; high-risk medicines; medicated creams; NSAIDs; PPIs unless Barrett’s or another long-term indication; PRN medicines including Buccolam, EpiPen, GlucaGen and GTN; shared-care medicines.</p></details></article><article class=\"card\" id=\"route2\"><span class=\"tag\">Route 2</span><h3>Chronic disease medication</h3><p>Align authorisation with the birth-month chronic disease review. Nurses reauthorise appropriate medication during Medlink or face-to-face review. The Prescription Team may reauthorise up to the birth month.</p></article><article class=\"card\" id=\"route3\"><span class=\"tag\">Route 3</span><h3>Condition has its own regular review</h3><p>Examples include HRT and contraception. Align authorisation with the condition-specific review using the same approach as chronic disease medication.</p></article><article class=\"card\" id=\"route4\"><span class=\"tag warn\">Route 4</span><h3>Reviewable without patient input</h3><p>Send to the appropriate pharmacist or CD review route.</p><div class=\"warning\"><strong>Agreed medication list required.</strong> The source contains the heading for this list but no medicines. Do not infer eligibility.</div></article><article class=\"card\" id=\"route5\"><span class=\"tag red\">Route 5</span><h3>Requires regular blood monitoring</h3><p>Follow the Medlink Monitoring pathway. The Prescription Team should not routinely reauthorise these medicines.</p><details><summary>Approved high-risk monitoring list</summary><p>Azathioprine; Azithromycin; Carbimazole; Ciclosporin; Eplerenone; Leflunomide; Lithium; Priadel; Methotrexate; Metoject; Mycophenolate; Riluzole; Salazopyrin; Sulfasalazine; Spironolactone.</p></details></article><article class=\"card\" id=\"route6\"><span class=\"tag\">Route 6</span><h3>Everything else</h3><p>A patient medication review is required, normally through Medlink Medication Review. The intended model is a birth-month invite, administered by the Medlink team and reviewed by CD.</p></article></div></section><section><h2>Related guidance</h2><a class=\"button\" href=\"#/medlink-recall\">Medlink chronic disease recall</a> <span class=\"pill\">Medlink Monitoring page awaiting source</span></section><section class=\"feedback\"><article><h3>Can’t find what you need?</h3><p>Speak to your Team Manager. Escalate immediate clinical uncertainty appropriately.</p></article><article><h3>Something missing or out of date?</h3><a class=\"button\" target=\"_blank\" rel=\"noopener\" href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=uChWuyjjgkCoVkM8ntyPrh1OqYcKWvRBlYRB8sgp6JhUNFlHR1ZFOVJGMFBTQkhRTVFEOURZUjdJVS4u\">Suggest an update</a></article></section><footer class=\"footer\"><p><strong>Source:</strong> Bradley’s Practice Medication reviews document.</p><p><strong>Owner:</strong> Medicines Management · <strong>Last reviewed:</strong> not supplied · <strong>Next review:</strong> review date required.</p></footer></main></div>","script":""},"mgus-monitoring":{"title":"MGUS monitoring | Bradley’s Practice","html":"<style>:ho
